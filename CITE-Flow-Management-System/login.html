
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CiteFlow - Login</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #f8f9fa;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        .left-side {
            width: 40%;
            flex: 0 0 40%;
            position: relative;
            background: url('bldg1.jpg') 54% center / cover no-repeat;
            overflow: hidden;
            min-width: 0;
        }

        .left-side::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                180deg,
                rgba(0, 0, 0, 0.04) 0%,
                rgba(0, 0, 0, 0.18) 100%
            );
            pointer-events: none;
        }

        .dept-logos {
            position: absolute;
            bottom: 40px;
            left: 40px;
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 2;
        }

        .dept-logo-circle {
            width: 78px;
            height: 78px;
            border-radius: 50%;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 9px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28);
            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }

        .dept-logo-circle:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 9px 22px rgba(0, 0, 0, 0.35);
        }

        .dept-logo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .right-side {
            width: 60%;
            flex: 0 0 60%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            padding: 25px 35px;
            overflow: hidden;
            min-width: 0;
        }

        .form-container {
            width: 100%;
            max-width: 420px;
            max-height: 100%;
            overflow: hidden;
        }

        .logo {
            width: 78px;
            height: 78px;
            object-fit: contain;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 2rem;
            color: #1f2937;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .subtitle {
            color: #64748b;
            font-size: 0.92rem;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 16px;
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 0.84rem;
            margin-bottom: 6px;
            color: #374151;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            height: 50px;
            padding: 0 48px 0 48px;
            border: 1.5px solid #e2e8f0;
            border-radius: 11px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            color: #1f2937;
            background: #ffffff;
            transition: all 0.3s ease;
        }

        .input-wrapper input::placeholder {
            color: #9ca3af;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: #9c2f1f;
            box-shadow: 0 0 0 4px rgba(156, 47, 31, 0.12);
        }

        .input-icon {
            position: absolute;
            left: 17px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 1rem;
            pointer-events: none;
            z-index: 2;
        }

        .toggle-password {
            position: absolute;
            right: 17px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            cursor: pointer;
            font-size: 1rem;
            transition: color 0.2s ease;
            z-index: 3;
            user-select: none;
        }

        .toggle-password:hover {
            color: #9c2f1f;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 13px 0 20px;
            font-size: 0.82rem;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #374151;
            cursor: pointer;
        }

        .remember input {
            accent-color: #9c2f1f;
            cursor: pointer;
        }

        .forgot {
            color: #9c2f1f;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .forgot:hover {
            text-decoration: underline;
            color: #7f2519;
        }

        .login-btn {
            width: 100%;
            height: 50px;
            background: linear-gradient(
                135deg,
                #9c2f1f,
                #c2412d
            );
            color: white;
            border: none;
            border-radius: 11px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(156, 47, 31, 0.25);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(156, 47, 31, 0.35);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            padding: 10px 14px;
            margin: 12px 0;
            border-radius: 10px;
            font-size: 0.82rem;
            line-height: 1.5;
            display: none;
        }

        .message.error {
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .message.success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .register {
            text-align: center;
            margin-top: 16px;
            font-size: 0.84rem;
            color: #64748b;
        }

        .register a {
            color: #9c2f1f;
            font-weight: 600;
            text-decoration: none;
        }

        .register a:hover {
            text-decoration: underline;
        }

        @media (max-width: 1000px) {

            html,
            body {
                overflow-y: auto;
            }

            .container {
                min-height: 100vh;
                height: auto;
                overflow: visible;
                flex-direction: column;
            }

            .left-side {
                width: 100%;
                height: 280px;
                flex: none;
            }

            .dept-logos {
                bottom: 25px;
                left: 25px;
                gap: 13px;
            }

            .dept-logo-circle {
                width: 62px;
                height: 62px;
                padding: 7px;
            }

            .right-side {
                width: 100%;
                flex: none;
                padding: 35px 25px;
                overflow: visible;
            }

            .form-container {
                max-width: 500px;
                max-height: none;
                overflow: visible;
            }
        }

        @media (max-width: 600px) {

            .left-side {
                height: 220px;
            }

            .right-side {
                padding: 30px 20px;
            }

            .logo {
                width: 65px;
                height: 65px;
            }

            h1 {
                font-size: 1.65rem;
            }

            .subtitle {
                margin-bottom: 20px;
            }

            .input-group {
                margin-bottom: 14px;
            }

            .options {
                font-size: 0.78rem;
            }

            .dept-logo-circle {
                width: 52px;
                height: 52px;
                padding: 6px;
            }

            .dept-logos {
                bottom: 18px;
                left: 18px;
                gap: 9px;
            }
        }

        @media (max-height: 700px) and (min-width: 1001px) {

            .right-side {
                padding-top: 12px;
                padding-bottom: 12px;
            }

            .logo {
                width: 60px;
                height: 60px;
                margin-bottom: 6px;
            }

            h1 {
                font-size: 1.75rem;
            }

            .subtitle {
                margin-bottom: 15px;
            }

            .input-group {
                margin-bottom: 11px;
            }

            .input-group label {
                margin-bottom: 4px;
            }

            .input-wrapper input {
                height: 44px;
            }

            .options {
                margin: 10px 0 14px;
            }

            .login-btn {
                height: 45px;
            }

            .register {
                margin-top: 10px;
            }

            .dept-logo-circle {
                width: 68px;
                height: 68px;
                padding: 8px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- LEFT SIDE -->

    <div class="left-side">

        <div class="dept-logos">

            <div class="dept-logo-circle">
                <img
                    src="bit_logo.png"
                    alt="BIT Logo"
                    class="dept-logo"
                >
            </div>

            <div class="dept-logo-circle">
                <img
                    src="bsit_logo.png"
                    alt="BSIT Logo"
                    class="dept-logo"
                >
            </div>

            <div class="dept-logo-circle">
                <img
                    src="bsie_logo.png"
                    alt="BSIE Logo"
                    class="dept-logo"
                >
            </div>

        </div>

    </div>


    <!-- RIGHT SIDE -->

    <div class="right-side">

        <div class="form-container">

            <img
                src="ctu-logo.png"
                alt="CTU Logo"
                class="logo"
            >

            <h1>
                Welcome Back!
            </h1>

            <p class="subtitle">
                Access your CiteFlow account
            </p>


            <div
                id="message"
                class="message">
            </div>


            <!-- LOGIN FORM -->

            <form id="loginForm">

                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <div class="input-wrapper">

                        <i class="fas fa-envelope input-icon"></i>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter email"
                            required
                            autocomplete="email"
                        >

                    </div>

                </div>


                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <i class="fas fa-lock input-icon"></i>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter password"
                            required
                            autocomplete="current-password"
                        >

                        <i
                            class="fas fa-eye toggle-password"
                            id="togglePassword"
                            title="Show password"
                            role="button"
                            tabindex="0"
                            aria-label="Show password">
                        </i>

                    </div>

                </div>


                <div class="options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        Remember me

                    </label>


                    <a
                        href="forgot.html"
                        class="forgot">

                        Forgot Password?

                    </a>

                </div>


                <button
                    type="submit"
                    id="loginBtn"
                    class="login-btn">

                    Log in

                </button>

            </form>


            <!-- REGISTER -->

            <div class="register">

                Don't have an account?

                <a href="register.html">
                    Register
                </a>

            </div>

        </div>

    </div>

</div>


<script>

/* =====================================================
   SUPABASE CONFIGURATION
===================================================== */

const supabaseUrl =
    'https://uforealazougjckepggc.supabase.co';

const supabasePublishableKey =
    'sb_publishable_zsr5gF2_SeiOE6FHcj-p1A_XbieZ3GO';

const {
    createClient
} = supabase;

const supabaseClient =
    createClient(
        supabaseUrl,
        supabasePublishableKey
    );


/* =====================================================
   ELEMENTS
===================================================== */

const loginForm =
    document.getElementById('loginForm');

const loginBtn =
    document.getElementById('loginBtn');

const messageDiv =
    document.getElementById('message');

const emailInput =
    document.getElementById('email');

const passwordField =
    document.getElementById('password');

const togglePassword =
    document.getElementById('togglePassword');

const rememberMe =
    document.getElementById('rememberMe');


/* =====================================================
   PASSWORD VISIBILITY
===================================================== */

function togglePasswordVisibility() {

    const currentlyHidden =
        passwordField.type === 'password';

    if (currentlyHidden) {

        passwordField.type = 'text';

        togglePassword.classList.remove(
            'fa-eye'
        );

        togglePassword.classList.add(
            'fa-eye-slash'
        );

        togglePassword.title =
            'Hide password';

        togglePassword.setAttribute(
            'aria-label',
            'Hide password'
        );

    } else {

        passwordField.type = 'password';

        togglePassword.classList.remove(
            'fa-eye-slash'
        );

        togglePassword.classList.add(
            'fa-eye'
        );

        togglePassword.title =
            'Show password';

        togglePassword.setAttribute(
            'aria-label',
            'Show password'
        );

    }
}


togglePassword.addEventListener(
    'click',
    togglePasswordVisibility
);


togglePassword.addEventListener(
    'keydown',
    function(event) {

        if (
            event.key === 'Enter' ||
            event.key === ' '
        ) {

            event.preventDefault();

            togglePasswordVisibility();

        }

    }
);


/* =====================================================
   REMEMBER EMAIL
===================================================== */

const savedEmail =
    localStorage.getItem(
        'citeflow_remembered_email'
    );

if (savedEmail) {

    emailInput.value =
        savedEmail;

    rememberMe.checked =
        true;
}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type = 'error'
) {

    messageDiv.textContent =
        text;

    messageDiv.className =
        `message ${type}`;

    messageDiv.style.display =
        'block';
}


function hideMessage() {

    messageDiv.style.display =
        'none';

    messageDiv.textContent =
        '';

}


/* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener(
    'submit',
    async function(event) {

        event.preventDefault();

        hideMessage();

        const email =
            emailInput.value
                .trim()
                .toLowerCase();

        const password =
            passwordField.value;


        /* -----------------------------------------------
           VALIDATION
        ------------------------------------------------ */

        if (!email) {

            showMessage(
                'Please enter your email address.',
                'error'
            );

            return;

        }


        if (!password) {

            showMessage(
                'Please enter your password.',
                'error'
            );

            return;

        }


        /* -----------------------------------------------
           LOADING
        ------------------------------------------------ */

        loginBtn.disabled =
            true;

        loginBtn.textContent =
            'Logging in...';


        try {

            console.log(
                'Attempting login:',
                email
            );


            /* =============================================
               SUPABASE AUTH
            ============================================= */

            const {
                data: authData,
                error: authError
            } =
                await supabaseClient.auth
                    .signInWithPassword({
                        email: email,
                        password: password
                    });


            if (authError) {

                console.error(
                    'Supabase Auth Error:',
                    authError
                );

                throw authError;

            }


            const user =
                authData?.user;


            if (!user) {

                throw new Error(
                    'Login succeeded but no user was returned.'
                );

            }


            /* =============================================
               EMAIL CONFIRMATION
            ============================================= */

            if (
                user.email_confirmed_at === null
            ) {

                await supabaseClient.auth.signOut();

                throw new Error(
                    'EMAIL_NOT_CONFIRMED'
                );

            }


            /* =============================================
               GET ROLE
            ============================================= */

            let role =
                String(
                    user.user_metadata?.role ||
                    ''
                )
                .toLowerCase()
                .trim();


            /* =============================================
               CHECK FACULTY PROFILE
            ============================================= */

            const {
                data: facultyProfile,
                error: facultyError
            } =
                await supabaseClient
                    .from('faculty')
                    .select(
                        `
                        id,
                        faculty_id,
                        name,
                        full_name,
                        email,
                        role,
                        status,
                        access_enabled,
                        must_change_password,
                        profile_completed
                        `
                    )
                    .eq(
                        'auth_user_id',
                        user.id
                    )
                    .maybeSingle();


            if (facultyError) {

                console.error(
                    'Faculty profile check error:',
                    facultyError
                );

            }


            /* =================================================
               FACULTY LOGIN
            ================================================= */

            if (facultyProfile) {

                console.log(
                    'Faculty account detected:',
                    facultyProfile
                );


                /* ---------------------------------------------
                   CHECK FACULTY STATUS
                --------------------------------------------- */

                if (
                    facultyProfile.status &&
                    String(
                        facultyProfile.status
                    ).toLowerCase() !== 'active'
                ) {

                    await supabaseClient.auth.signOut();

                    localStorage.removeItem(
                        'citeflow_user'
                    );

                    throw new Error(
                        'FACULTY_INACTIVE'
                    );

                }


                /* ---------------------------------------------
                   CHECK ACCESS
                --------------------------------------------- */

                if (
                    facultyProfile.access_enabled === false
                ) {

                    await supabaseClient.auth.signOut();

                    localStorage.removeItem(
                        'citeflow_user'
                    );

                    throw new Error(
                        'FACULTY_ACCESS_DISABLED'
                    );

                }


                /* ---------------------------------------------
                   SAVE FACULTY USER
                --------------------------------------------- */

                const facultyUserInfo = {

                    id:
                        user.id,

                    email:
                        user.email,

                    name:
                        facultyProfile.full_name ||
                        facultyProfile.name ||
                        user.user_metadata?.full_name ||
                        user.email?.split('@')[0] ||
                        'Faculty',

                    role:
                        'faculty',

                    facultyId:
                        facultyProfile.faculty_id

                };


                localStorage.setItem(
                    'citeflow_user',
                    JSON.stringify(
                        facultyUserInfo
                    )
                );


                /* ---------------------------------------------
                   REMEMBER ME
                --------------------------------------------- */

                if (rememberMe.checked) {

                    localStorage.setItem(
                        'citeflow_remembered_email',
                        email
                    );

                } else {

                    localStorage.removeItem(
                        'citeflow_remembered_email'
                    );

                }


                /* ---------------------------------------------
                   FORCE ACCOUNT SETUP
                --------------------------------------------- */

                if (
                    facultyProfile.must_change_password === true
                ) {

                    showMessage(
                        'Login successful. Please complete your account setup.',
                        'success'
                    );


                    setTimeout(
                        function() {

                            window.location.replace(
                                'setup-account.html'
                            );

                        },
                        500
                    );

                    return;

                }


                /* ---------------------------------------------
                   FACULTY DASHBOARD
                --------------------------------------------- */

                showMessage(
                    'Login successful. Redirecting to your faculty dashboard...',
                    'success'
                );


                setTimeout(
                    function() {

                        window.location.replace(
                            'faculty/dashboard.html'
                        );

                    },
                    500
                );


                return;

            }


            /* =================================================
               ADMIN LOGIN
            ================================================= */

            const adminRole =
                String(
                    user.user_metadata?.role ||
                    ''
                )
                .toLowerCase()
                .trim();


            const adminRoles = [
                'administrator',
                'admin',
                'dean',
                'chairperson'
            ];


            /* -----------------------------------------------
               CHECK ADMIN PROFILE
            ------------------------------------------------ */

            const {
                data: adminProfile,
                error: adminProfileError
            } =
                await supabaseClient
                    .from('admin_profiles')
                    .select(
                        'id, role'
                    )
                    .eq(
                        'id',
                        user.id
                    )
                    .maybeSingle();


            if (adminProfileError) {

                console.warn(
                    'Admin profile check:',
                    adminProfileError
                );

            }


            if (
                adminProfile ||
                adminRoles.includes(adminRole)
            ) {

                const finalAdminRole =
                    String(
                        adminProfile?.role ||
                        adminRole ||
                        'administrator'
                    )
                    .toLowerCase()
                    .trim();


                const adminUserInfo = {

                    id:
                        user.id,

                    email:
                        user.email,

                    name:
                        user.user_metadata?.full_name ||
                        user.user_metadata?.name ||
                        user.email?.split('@')[0] ||
                        'Administrator',

                    role:
                        finalAdminRole

                };


                localStorage.setItem(
                    'citeflow_user',
                    JSON.stringify(
                        adminUserInfo
                    )
                );


                if (rememberMe.checked) {

                    localStorage.setItem(
                        'citeflow_remembered_email',
                        email
                    );

                } else {

                    localStorage.removeItem(
                        'citeflow_remembered_email'
                    );

                }


                showMessage(
                    'Login successful. Redirecting...',
                    'success'
                );


                setTimeout(
                    function() {

                        window.location.replace(
                            'admin/faculty-profiles.html'
                        );

                    },
                    500
                );


                return;

            }


            /* =================================================
               UNKNOWN ACCOUNT
            ================================================= */

            await supabaseClient.auth.signOut();

            localStorage.removeItem(
                'citeflow_user'
            );


            throw new Error(
                'ACCOUNT_ROLE_NOT_RECOGNIZED'
            );

        }

        catch (err) {

            console.error(
                'Login Error:',
                err
            );


            let msg =
                'Unable to log in. Please try again.';


            if (
                err.message ===
                'EMAIL_NOT_CONFIRMED'
            ) {

                msg =
                    'Your email address has not been confirmed yet. Please check your email and click the confirmation link.';

            }


            else if (
                err.message ===
                'FACULTY_INACTIVE'
            ) {

                msg =
                    'Your faculty account is currently inactive. Please contact the administrator.';

            }


            else if (
                err.message ===
                'FACULTY_ACCESS_DISABLED'
            ) {

                msg =
                    'Access to your faculty account has been disabled. Please contact the administrator.';

            }


            else if (
                err.message ===
                'ACCOUNT_ROLE_NOT_RECOGNIZED'
            ) {

                msg =
                    'Your account role could not be recognized. Please contact the administrator.';

            }


            else if (
                err.message?.toLowerCase()
                    .includes(
                        'invalid login credentials'
                    )
            ) {

                msg =
                    'Incorrect email or password. Please check your credentials and try again.';

            }


            else if (
                err.message?.toLowerCase()
                    .includes(
                        'email not confirmed'
                    )
            ) {

                msg =
                    'Your email address has not been confirmed yet. Please check your email.';

            }


            else if (
                err.message?.toLowerCase()
                    .includes(
                        'invalid api key'
                    )
            ) {

                msg =
                    'Supabase API key is invalid. Please check your Supabase configuration.';

            }


            else if (
                err.message?.toLowerCase()
                    .includes(
                        'failed to fetch'
                    )
            ) {

                msg =
                    'Network error. Please check your internet connection and try again.';

            }


            else if (
                err.message?.toLowerCase()
                    .includes(
                        'network'
                    )
            ) {

                msg =
                    'Network error. Please check your internet connection.';

            }


            else {

                msg =
                    `Login failed: ${
                        err.message ||
                        'Unknown error'
                    }`;

            }


            showMessage(
                msg,
                'error'
            );

        }

        finally {

            loginBtn.disabled =
                false;

            loginBtn.textContent =
                'Log in';

        }

    }
);


/* =====================================================
   EXISTING SESSION
===================================================== */

async function checkExistingSession() {

    try {

        const {
            data,
            error
        } =
            await supabaseClient.auth
                .getSession();


        if (error) {

            console.error(
                'Session check error:',
                error
            );

            return;

        }


        const session =
            data?.session;


        if (!session?.user) {

            return;

        }


        console.log(
            'Existing session:',
            session.user.email
        );

    }

    catch (error) {

        console.error(
            'Session check failed:',
            error
        );

    }

}


checkExistingSession();

</script>

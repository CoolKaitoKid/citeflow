<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CiteFlow - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            overflow: hidden;
            background: #f8f9fa;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* LEFT SIDE - BUILDING IMAGE */
        .left-side {
            flex: 1;
            position: relative;
            background: url('assets/bldg1.jpg') center/cover no-repeat;
            overflow: hidden;
        }

        .left-side::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.28));
        }

        /* Department Logos */
        .dept-logos {
            position: absolute;
            bottom: 45px;
            left: 45px;
            display: flex;
            gap: 20px;
            z-index: 2;
        }

        .dept-logo {
            width: 78px;
            height: 78px;
            object-fit: contain;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.4));
            transition: transform 0.3s ease;
        }

        .dept-logo:hover {
            transform: scale(1.1);
        }

        /* RIGHT SIDE */
        .right-side {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            padding: 20px;
        }

        .form-container {
            width: 100%;
            max-width: 420px;
        }

        .logo {
            width: 90px;
            height: 90px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.1rem;
            color: #1f2937;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            font-size: 1rem;
            margin-bottom: 35px;
        }

        .input-group {
            margin-bottom: 22px;
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #374151;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            height: 54px;
            padding: 0 16px 0 50px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: #9c2f1f;
            box-shadow: 0 0 0 4px rgba(156, 47, 31, 0.15);
        }

        .input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 1.25rem;
        }

        .toggle-password {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 18px 0 28px;
            font-size: 0.93rem;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #374151;
        }

        .forgot {
            color: #9c2f1f;
            text-decoration: none;
            font-weight: 500;
        }

        .login-btn {
            width: 100%;
            height: 56px;
            background: linear-gradient(135deg, #9c2f1f, #c2412d);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.08rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(156, 47, 31, 0.3);
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(156, 47, 31, 0.4);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .message {
            padding: 12px 16px;
            margin: 15px 0;
            border-radius: 10px;
            font-size: 0.95rem;
            display: none;
        }

        .message.error {
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .register {
            text-align: center;
            margin-top: 30px;
            font-size: 0.95rem;
            color: #64748b;
        }

        .register a {
            color: #9c2f1f;
            font-weight: 600;
            text-decoration: none;
        }

        @media (max-width: 900px) {
            .container {
                flex-direction: column;
            }
            .left-side {
                height: 320px;
            }
            .dept-logos {
                bottom: 25px;
                left: 25px;
                gap: 15px;
            }
            .dept-logo {
                width: 62px;
                height: 62px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Left Side -->
        <div class="left-side">
            <div class="dept-logos">
                <img src="assets/bit_logo.png" alt="BIT Logo" class="dept-logo">
                <img src="assets/bsit_logo.png" alt="BSIT Logo" class="dept-logo">
                <img src="assets/bsie_logo.png" alt="BSIE Logo" class="dept-logo">
            </div>
        </div>

        <!-- Right Side Form -->
        <div class="right-side">
            <div class="form-container">
                <img src="assets/ctu-logo.png" alt="CTU Logo" class="logo">

                <h1>Welcome Back!</h1>
                <p class="subtitle">Access your CiteFlow account</p>

                <div id="message" class="message"></div>

                <form id="loginForm">
                    <div class="input-group">
                        <label>Email Address</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" id="email" placeholder="Enter email" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="password" placeholder="Enter password" required>
                            <i class="fas fa-eye toggle-password" id="togglePassword"></i>
                        </div>
                    </div>

                    <div class="options">
                        <label class="remember">
                            <input type="checkbox"> Remember me
                        </label>
                        <a href="#" class="forgot">Forgot Password?</a>
                    </div>

                    <button type="submit" id="loginBtn" class="login-btn">Log in</button>
                </form>

                <div class="register">
                    Don't have an account? 
                    <a href="register.html">Register</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ================== PASSWORD TOGGLE ==================
        const togglePassword = document.getElementById('togglePassword');
        const passwordField = document.getElementById('password');

        togglePassword.addEventListener('click', () => {
            const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordField.setAttribute('type', type);
            togglePassword.classList.toggle('fa-eye');
            togglePassword.classList.toggle('fa-eye-slash');
        });

        // ================== SUPABASE CONFIG ==================
        const supabaseUrl = 'https://uforealazougjckepggc.supabase.co';
        const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmb3JlYWxhem91Z2pja2VwZ2djIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNjAzODksImV4cCI6MjA5MTgzNjM4OX0.wzGQAiYOuiQjb3gAbaF41yAJJyQ-CCHfMruNUEwfnp0';

        const { createClient } = supabase;
        const supabaseClient = createClient(supabaseUrl, supabaseAnonKey);

        // ================== LOGIN HANDLER ==================
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const messageDiv = document.getElementById('message');

        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            messageDiv.style.display = 'none';

            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (authError) throw authError;

                const user = authData?.user;
                const role = String(user?.user_metadata?.role || '').toLowerCase();

                // Store user info
                const userInfo = {
                    id: user.id,
                    email: user.email,
                    name: user.user_metadata?.full_name || user.email?.split('@')[0] || 'User',
                    role: role
                };
                localStorage.setItem('citeflow_user', JSON.stringify(userInfo));

                const { data: facultyProfile } = await supabaseClient
                    .from('faculty')
                    .select('id')
                    .eq('auth_user_id', user.id)
                    .maybeSingle();

                if (role === 'faculty' || facultyProfile) {
                    await supabaseClient.auth.signOut();
                    throw new Error('Faculty accounts are not allowed in the admin portal. Please use Faculty Login.');
                }

                window.location.href = 'admin/faculty-profiles.html';

            } catch (err) {
                console.error('Login Error:', err);
                let msg = 'Invalid email or password. Please try again.';

                if (err.message.includes('Invalid login credentials')) {
                    msg = 'Incorrect email or password.';
                } else if (err.message.includes('not allowed in the admin portal')) {
                    msg = err.message;
                } else if (err.message.includes('Email not confirmed')) {
                    msg = 'Please confirm your email before logging in.';
                } else if (err.message.includes('Failed to fetch')) {
                    msg = 'Network error. Please check your internet connection.';
                }

                showMessage(msg, 'error');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Log in';
            }
        });

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
        }
    </script>
</body>
</html>

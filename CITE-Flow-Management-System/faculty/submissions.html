/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value) {

    return String(value ?? '').replace(
        /[&<>'"]/g,
        ch => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            "'": '&#39;',
            '"': '&quot;'
        }[ch])
    );

}


function formatDate(iso) {

    if (!iso) {
        return 'No due date';
    }

    return new Date(iso).toLocaleDateString(
        'en-US',
        {
            month: 'short',
            day: 'numeric',
            year: 'numeric'
        }
    );

}


function formatDateTime(iso) {

    if (!iso) {
        return 'No deadline';
    }

    return new Date(iso).toLocaleString(
        'en-US',
        {
            month: 'short',
            day: 'numeric',
            year: 'numeric',
            hour: 'numeric',
            minute: '2-digit'
        }
    );

}


/*
|--------------------------------------------------------------------------
| Effective deadline
|--------------------------------------------------------------------------
|
| New recurring tasks use deadline_at.
| Old/regular tasks can continue using due_at.
|
*/

function getTaskDeadline(task) {

    if (window.CiteFlowWorkflow?.getTaskDeadline) {
        return CiteFlowWorkflow.getTaskDeadline(task);
    }

    return task?.deadline_at
        || task?.due_at
        || null;

}


function isPastDueDate(iso) {

    if (!iso) {
        return false;
    }

    return new Date(iso).getTime() < Date.now();

}


function isPastDue(task) {

    return isPastDueDate(
        getTaskDeadline(task)
    );

}


function daysUntil(task) {

    const deadline = getTaskDeadline(task);

    if (!deadline) {
        return null;
    }

    return Math.ceil(
        (
            new Date(deadline).getTime()
            - Date.now()
        )
        / 86400000
    );

}


function getTaskById(id) {

    return state.tasks.find(
        task =>
            String(task.id) === String(id)
    );

}


function getSubmission(taskId, facultyId) {

    return state.submissions.find(
        submission =>
            String(submission.task_id) === String(taskId)
            &&
            String(submission.faculty_id) === String(facultyId)
    );

}


function getSubmissionFileRecords(submissionId) {

    return state.submissionFiles
        .filter(
            file =>
                String(file.submission_id)
                === String(submissionId)
        );

}


function getSubmissionFiles(submissionId) {

    return getSubmissionFileRecords(submissionId)
        .map(
            file => file.file_name
        );

}


function getDraftFiles(taskId) {

    return Array.isArray(
        draftUploads[taskId]
    )
        ? draftUploads[taskId]
        : [];

}


function getDraftFileNames(taskId) {

    return getDraftFiles(taskId)
        .map(file => file?.name)
        .filter(Boolean);

}


function getWorkflowStageSafe(submission, task) {

    if (window.CiteFlowWorkflow?.getWorkflowStage) {
        return CiteFlowWorkflow.getWorkflowStage(submission, task);
    }

    return null;

}


function canManageSubmissionFiles(submission, task) {

    if (window.CiteFlowWorkflow?.canFacultyManageSubmissionFiles) {
        return CiteFlowWorkflow.canFacultyManageSubmissionFiles(submission, task);
    }

    const status =
        String(
            submission?.status
            || ''
        ).toLowerCase();

    return status !== 'approved';

}


function isFileManagementLocked(submission, task) {

    return !canManageSubmissionFiles(submission, task);

}


function isInReviewStage(submission, task) {

    const stage =
        getWorkflowStageSafe(
            submission,
            task
        );

    if (stage) {
        return [
            'submitted',
            'chairperson_review',
            'final_approval'
        ].includes(stage);
    }

    const status =
        String(
            submission?.status
            || ''
        ).toLowerCase();

    return [
        'submitted',
        'late',
        'underreview',
        'approved'
    ].includes(status);

}


function toastMessage(message, type) {

        CiteFlowWorkflow.showToast(message, type);
        return;
    }

    alert(message);

}


/* =========================================================
   SUBMISSION METHOD
========================================================= */

function getSubmissionMethod(task) {

    const method = String(
        task?.submission_method
        || 'upload'
    )
        .trim()
        .toLowerCase();

    if (
        [
            'link',
            'url',
            'external',
            'external_link'
        ].includes(method)
    ) {
        return 'link';
    }

    return 'upload';

}


function getSubmissionMethodLabel(task) {

    return getSubmissionMethod(task) === 'link'
        ? 'Link Submission'
        : 'File Upload';

}


/* =========================================================
   REPORTING PERIOD
========================================================= */

function getReportingPeriodText(task) {

    if (task.reporting_period_label) {
        return task.reporting_period_label;
    }

    if (
        task.reporting_period_start
        &&
        task.reporting_period_end
    ) {
        return `${formatDate(task.reporting_period_start)} – ${formatDate(task.reporting_period_end)}`;
    }

    if (task.generated_for_period) {
        return task.generated_for_period;
    }

    return 'Current reporting period';

}


function normalizeFacultyForSubmissions(row) {
    if (window.CiteFlowWorkflow) {
        return CiteFlowWorkflow.normalizeFaculty(row);
    }
    return {
        ...row,
        id: row.id,
        auth_user_id: row.auth_user_id || null,
        full_name: row.full_name || row.name || row.email || 'Faculty Member',
        department_code: row.department || row.department_code || 'N/A',
        is_active: row.access_enabled !== false && String(row.status || 'Active').toLowerCase() === 'active'
    };
}

}


/* =========================================================
   AUTHENTICATION
========================================================= */

async function requireFacultyAuth() {

    if (
        authChecked
        &&
        currentUser
    ) {
        return true;
    }

    const {
        data,
        error
    } =
        await db.auth.getSession();

    if (
        error
        ||
        !data?.session?.user
    ) {
        window.location.href =
            '../login.html';

        return false;
    }

    const user =
        data.session.user;

    if (window.CiteFlowWorkflow?.canAccessFacultyPortalSession) {
        const access = await CiteFlowWorkflow.canAccessFacultyPortalSession(user);
        if (!access.allowed) {
            await db.auth.signOut();
            window.location.href = '../login.html';
            return false;
        }
    } else {
        const profileProbe = await db
            .from('faculty')
            .select('role, position')
            .eq('auth_user_id', user.id)
            .maybeSingle();

        const metaRole = String(user.user_metadata?.role || '').toLowerCase();
        const profileRole = String(profileProbe.data?.role || profileProbe.data?.position || '').toLowerCase();
        const portalRole = profileRole || metaRole;
        const allowedPortal =
            portalRole === 'faculty'
            || portalRole.includes('chair')
            || portalRole === 'dean'
            || portalRole.includes('secretary')
            || portalRole === 'admin'
            || portalRole === 'administrator'
            || !!profileProbe.data;

        if (portalRole && !allowedPortal) {
            await db.auth.signOut();
            window.location.href = '../login.html';
            return false;
        }
    }

    currentUser = user;

    authChecked = true;

    return true;

}


/* =========================================================
   LOAD FACULTY PROFILE
========================================================= */

async function loadCurrentFacultyProfile() {

    if (!currentUser) {
        return null;
    }

    if (window.CiteFlowWorkflow) {
        return CiteFlowWorkflow.getCurrentFaculty(currentUser);
    }

    const email =
        String(
            currentUser.email
            || ''
        ).toLowerCase();

    let response =
        await db
            .from('faculty')
            .select('*')
            .eq(
                'auth_user_id',
                currentUser.id
            )
            .maybeSingle();

    if (response.error) {
        console.error(
            'Failed to load faculty profile:',
            response.error
        );
    }

    if (
        !response.data
        &&
        email
    ) {

        response =
            await db
                .from('faculty')
                .select('*')
                .or(
                    `email.eq.${email},existing_email.eq.${email}`
                )
                .maybeSingle();

    }

    if (!response.data) {
        return null;
    }

    const normalized =
        normalizeFacultyForSubmissions(
            response.data
        );

    return normalized;

}


/* =========================================================
   STATUS
========================================================= */

function effectiveStatus(task, submission) {

    if (window.CiteFlowWorkflow) {
        return CiteFlowWorkflow.formatWorkflowStatus(submission, task);
    }

    if (!submission) {

        return isPastDue(task)
            ? 'Late'
            : 'Not Submitted';

    }

    const rawStatus =
        String(
            submission.status
            || ''
        ).toLowerCase();

    if (
        rawStatus === 'notsubmitted'
        &&
        isPastDue(task)
    ) {
        return 'Late';
    }

    const map = {

        submitted: 'Submitted',

        late: 'Late',

        underreview: 'Under Review',

        pending: 'Under Review',

        approved: 'Approved',

        rejected: 'Rejected',

        revision: 'Returned for Revision',

        notsubmitted: 'Not Submitted'

    };

    return map[rawStatus]
        || 'Not Submitted';

}


function isActionable(status, submission, task) {
    if (window.CiteFlowWorkflow) {
        const stage = CiteFlowWorkflow.getWorkflowStage(submission, task);
        return ['assigned', 'late_pending', 'revision_required', 'rejected'].includes(stage);
    }
    return [
        'Not Submitted',
        'Returned for Revision',
        'Revision Required',
        'Late',
        'Rejected',
        'Overdue — Not Submitted'
    ].includes(status);
}


function isSubmittedStatus(status, submission, task) {
    if (window.CiteFlowWorkflow) {
        const stage = CiteFlowWorkflow.getWorkflowStage(submission, task);
        return ['submitted', 'chairperson_review', 'final_approval', 'completed'].includes(stage);
    }
    return [
        'Submitted',
        'Under Review',
        'Approved',
        'Submitted — Pending Chairperson Review',
        'Pending Chairperson Review',
        'Pending Final Approval',
        'Completed'
    ].includes(status) || String(status || '').includes('Submitted') || String(status || '').includes('Review') || status === 'Completed';
}


function statusClass(status) {

    const map = {

        'Not Submitted':
            'bg-slate-100 text-slate-700 ring-1 ring-slate-200',

        'Submitted':
            'bg-blue-50 text-blue-700 ring-1 ring-blue-100',

        'Late':
            'bg-red-50 text-red-700 ring-1 ring-red-100',

        'Under Review':
            'bg-indigo-50 text-indigo-700 ring-1 ring-indigo-100',

        'Approved':
            'bg-emerald-50 text-emerald-700 ring-1 ring-emerald-100',

        'Rejected':
            'bg-slate-200 text-slate-700 ring-1 ring-slate-300',

        'Returned for Revision':
            'bg-amber-50 text-amber-700 ring-1 ring-amber-100'

    };

    return map[status]
        || map['Not Submitted'];

}


/* =========================================================
   DEADLINE INDICATOR
========================================================= */

function dueIndicator(task, status) {

    if (status === 'Approved') {

        return {
            color: 'bg-emerald-500',
            tone:
                'bg-emerald-50 text-emerald-700 ring-emerald-100',
            label: 'Approved',
            caption:
                'Completed and approved'
        };

    }

    const d =
        daysUntil(task);

    if (d === null) {

        return {
            color: 'bg-slate-300',
            tone:
                'bg-slate-50 text-slate-600 ring-slate-100',
            label: 'No deadline',
            caption:
                'No deadline set'
        };

    }

    if (d <= 0) {

        return {
            color: 'bg-red-500',
            tone:
                'bg-red-50 text-red-700 ring-red-100',
            label: 'Past due',
            caption:
                'The submission deadline has passed'
        };

    }

    if (d <= 1) {

        return {
            color: 'bg-red-500',
            tone:
                'bg-red-50 text-red-700 ring-red-100',
            label: '24 hrs left',
            caption:
                'Due within 24 hours'
        };

    }

    if (d <= 3) {

        return {
            color: 'bg-amber-400',
            tone:
                'bg-amber-50 text-amber-700 ring-amber-100',
            label:
                `${d} days left`,
            caption:
                'Deadline approaching'
        };

    }

    return {

        color: 'bg-slate-300',

        tone:
            'bg-slate-50 text-slate-600 ring-slate-100',

        label:
            `${d} days left`,

        caption:
            'On schedule'

    };

}


/* =========================================================
   ASSIGNED TASKS
========================================================= */

function getAssignedModels() {

    const faculty =
        resolveCurrentFaculty();

    if (!faculty) {
        return [];
    }

    const assignedTaskIds =
        state.assignments
            .filter(
                assignment =>
                    String(
                        assignment.faculty_id
                    )
                    ===
                    String(faculty.id)
            )
            .map(
                assignment =>
                    String(
                        assignment.task_id
                    )
            );

    return state.tasks
        .filter(
            task =>
                assignedTaskIds.includes(
                    String(task.id)
                )
        )
        .map(task => {

            const submission =
                getSubmission(
                    task.id,
                    faculty.id
                );

            const status =
                effectiveStatus(
                    task,
                    submission
                );

            const files =
                draftUploads[task.id]
                ||
                (
                    submission
                        ? getSubmissionFiles(
                            submission.id
                        )
                        : []
                );

            return {

                task,

                sub: submission,

                status,

                files,

                indicator:
                    dueIndicator(
                        task,
                        status
                    )

            };

        });

}


/* =========================================================
   FILTERING
========================================================= */

function getVisibleModels() {

    const query =
        (
            document
                .getElementById(
                    'taskSearch'
                )
                ?.value
            || window.__lastSearch
            || ''
        )
            .toLowerCase()
            .trim();

    return getAssignedModels()
        .filter(model => {

            const matchesFilter =

                currentFilter === 'all'

                ||

                (
                    currentFilter === 'pending'
                    &&
                    isActionable(
                        model.status,
                        model.sub,
                        model.task
                    )
                )

                ||

                (
                    currentFilter === 'submitted'
                    &&
                    isSubmittedStatus(
                        model.status,
                        model.sub,
                        model.task
                    )
                )

                ||

                (
                    currentFilter === 'recurring'
                    &&
                    model.task.is_recurring
                );

            const haystack =
                [
                    model.task.title,
                    model.task.instructions,
                    model.status,
                    model.task.reporting_period_label,
                    model.task.generated_for_period,
                    model.task.assigned_label,
                    window.CiteFlowWorkflow?.formatDocumentCategory
                        ? CiteFlowWorkflow.formatDocumentCategory(model.task)
                        : ''
                ]
                    .join(' ')
                    .toLowerCase();

            const matchesCategory =
                !currentCategoryFilter
                || (
                    window.CiteFlowWorkflow?.matchesDocumentCategory
                        ? CiteFlowWorkflow.matchesDocumentCategory(model.task, currentCategoryFilter)
                        : true
                );

            return (
                matchesFilter
                &&
                matchesCategory
                &&
                (
                    !query
                    ||
                    haystack.includes(query)
                )
            );

        });

}

    }

        { value: 'Syllabus', label: 'Syllabus', shortLabel: 'Syllabus' },

        { value: 'TOS', label: 'Table of Specifications (TOS)', shortLabel: 'TOS' },

function findQuickSubmitModel(categoryValue) {

    const models =
        getAssignedModels()
            .filter(model =>
                window.CiteFlowWorkflow?.matchesDocumentCategory
                    ? CiteFlowWorkflow.matchesDocumentCategory(model.task, categoryValue)
                    : false
            );

    const rank = (model) => {

        if (
            isActionable(
                model.status,
                model.sub,
                model.task
            )
        ) {
            return 0;
        }

        if (
            isSubmittedStatus(
                model.status,
                model.sub,
                model.task
            )
            &&
            !(
                window.CiteFlowWorkflow
                &&
                CiteFlowWorkflow.getWorkflowStage(model.sub, model.task) === 'completed'
            )
        ) {
            return 1;
        }

        return 2;

    };

    return models
        .filter(model => rank(model) < 2)
        .sort((a, b) => {

            const rankDiff =
                rank(a) - rank(b);

            if (rankDiff !== 0) {
                return rankDiff;
            }

            const aDue =
                new Date(getTaskDeadline(a.task) || a.task.created_at || 0).getTime();

            const bDue =
                new Date(getTaskDeadline(b.task) || b.task.created_at || 0).getTime();

            return aDue - bDue;

        })[0] || null;

}


async function createFacultyQuickTask(categoryValue) {

    const faculty =
        resolveCurrentFaculty();

    if (!faculty) {
        throw new Error('No matching active faculty profile found.');
    }

    const label =
        window.CiteFlowWorkflow?.formatDocumentCategory
            ? CiteFlowWorkflow.formatDocumentCategory(categoryValue)
            : categoryValue;

    const due =
        new Date();

    due.setDate(due.getDate() + 7);
    due.setHours(17, 0, 0, 0);

    const dueAt =
        due.toISOString();

    const row = {
        title: label,
        instructions: `Please submit your ${label}. This uses the standard CITE-Flow review workflow.`,
        due_at: dueAt,
        deadline_at: dueAt,
        created_by_name: faculty.full_name,
        attachment_names: [],
        assigned_label: 'Faculty self-submission',
        assigned_scope: 'specific',
        submission_method: 'file',
        is_recurring: false
    };

    let {
        data: task,
        error
    } =
        await db
            .from('wf_tasks')
            .insert(row)
            .select('*')
            .single();

    if (error && /column|schema|cache/i.test(error.message || '')) {

        const fallback = { ...row };
        delete fallback.deadline_at;
        delete fallback.submission_method;
        delete fallback.is_recurring;
        delete fallback.assigned_scope;
        delete fallback.assigned_label;

        const retry =
            await db
                .from('wf_tasks')
                .insert(fallback)
                .select('*')
                .single();

        task = retry.data;
        error = retry.error;

    }

    if (error) {
        throw error;
    }

    let assignmentError = null;

    const assignment =
        await db
            .from('wf_task_assignments')
            .insert({
                task_id: task.id,
                faculty_id: faculty.id,
                assigned_by_name: faculty.full_name
            });

    assignmentError = assignment.error;

    if (assignmentError && /column|schema|cache/i.test(assignmentError.message || '')) {

        const retry =
            await db
                .from('wf_task_assignments')
                .insert({
                    task_id: task.id,
                    faculty_id: faculty.id
                });

        assignmentError = retry.error;

    }

    if (assignmentError) {

        await db.from('wf_tasks').delete().eq('id', task.id);
        throw assignmentError;

    }

    return task;

}

async function openQuickSubmission(categoryValue) {

    if (quickSubmitInProgress || submitInProgress) {
        return;
    }

    const faculty =
        resolveCurrentFaculty();

    if (!faculty) {
        alert('No matching active faculty profile found.');
        return;
    }

    const existing =
        findQuickSubmitModel(categoryValue);

    if (existing) {
        openTask(existing.task.id);
        return;
    }

    quickSubmitInProgress = true;
    renderListPage();

    try {

        const task =
            await createFacultyQuickTask(categoryValue);

        const facultyId =
            faculty.id;

        state.tasks = [
            task,
            ...(state.tasks || []).filter(row => String(row.id) !== String(task.id))
        ];

        state.assignments = [
            {
                task_id: task.id,
                faculty_id: facultyId,
                assigned_by_name: faculty.full_name
            },
            ...(state.assignments || []).filter(row =>
                !(
                    String(row.task_id) === String(task.id)
                    &&
                    String(row.faculty_id) === String(facultyId)
                )
            )
        ];

        openTask(task.id);

    } catch (error) {

        console.error(error);
        alert(
            error?.message
            || 'Unable to start this submission. Please try again.'
        );
        currentView = 'list';
        renderListPage();

    } finally {

        quickSubmitInProgress = false;

    }

}

function wireUploadInputs() {

    document
        .querySelectorAll(
            '.task-upload-input'
        )
        .forEach(input => {

            input.addEventListener(
                'change',
                async event => {

                    const taskId =
                        event.target.dataset.task;

                    const incoming =
                        Array
                            .from(
                                event.target.files
                                || []
                            )
                            .filter(Boolean);

                    selectedTaskId =
                        String(taskId);

                    if (!incoming.length) {
                        return;
                    }

                    const task =
                        getTaskById(taskId);

                    const faculty =
                        resolveCurrentFaculty();

                    const submission =
                        faculty
                            ? getSubmission(
                                taskId,
                                faculty.id
                            )
                            : null;

                    if (
                        submission?.id
                        &&
                        canManageSubmissionFiles(
                            submission,
                            task
                        )
                    ) {

                        event.target.value = '';

                        await addSavedSubmissionFiles(
                            taskId,
                            incoming
                        );

                        return;

                    }

                    draftUploads[taskId] =
                        getDraftFiles(taskId)
                            .concat(incoming);

                    event.target.value = '';

                    renderDetailPage();

                }
            );

        });


    const replaceInput =
        document.getElementById(
            'fileReplaceInput'
        );

    if (replaceInput) {

        replaceInput.addEventListener(
            'change',
            async event => {

                const incoming =
                    Array
                        .from(
                            event.target.files
                            || []
                        )
                        .filter(Boolean)[0];

                const target =
                    pendingFileReplace;

                pendingFileReplace = null;

                event.target.value = '';

                if (!incoming || !target) {
                    return;
                }

                if (target.kind === 'draft') {

                    const drafts =
                        getDraftFiles(target.taskId)
                            .slice();

                    if (
                        target.index < 0
                        ||
                        target.index >= drafts.length
                    ) {
                        return;
                    }

                    drafts[target.index] =
                        incoming;

                    draftUploads[target.taskId] =
                        drafts;

                    selectedTaskId =
                        String(target.taskId);

                    renderDetailPage();

                    return;

                }

                await replaceSavedSubmissionFileWith(
                    target.taskId,
                    target.fileId,
                    incoming
                );

            }
        );

    }

}

function wireSubmissionUrlInput() {

    const input =

/* =========================================================
   FILE STORAGE
========================================================= */

function sanitizeFileName(name) {

    return String(
        name
        || 'file'
    )
        .replace(
            /[^a-zA-Z0-9.\-_]/g,
            '_'
        );

}


function isStorageBucketMissingError(error) {

    const message =
        String(
            error?.message
            || ''
        ).toLowerCase();

    return (
        message.includes('bucket')
        &&
        message.includes('not found')
    );

}


async function uploadFilesToStorage({
    facultyId,
    taskId,
    submissionId,
    files
}) {

    const uploaded = [];

    for (const file of files) {

        const safeName =
            sanitizeFileName(
                file.name
            );

        const path =
            `${facultyId}/${taskId}/${submissionId}/${Date.now()}-${safeName}`;


        const {
            error: uploadError
        } =
            await db
                .storage
                .from(submissionBucket)
                .upload(
                    path,
                    file,
                    {
                        upsert: true,
                        contentType:
                            file.type
                            || undefined
                    }
                );


        if (uploadError) {

            if (
                isStorageBucketMissingError(
                    uploadError
                )
            ) {

                throw new Error(
                    `Storage bucket "${submissionBucket}" is missing.`
                );

            }

            throw uploadError;

        }


        const {
            data
        } =
            db
                .storage
                .from(submissionBucket)
                .getPublicUrl(path);


        uploaded.push({

            file_name:
                file.name,

            file_url:
                data?.publicUrl
                || '',

            storage_path:
                path

        });

    }

    return uploaded;

}


async function deleteStoragePath(path) {

    if (!path) {
        return;
    }

    const {
        error
    } =
        await db
            .storage
            .from(submissionBucket)
            .remove([path]);

    if (error) {
        console.warn(
            'Could not remove storage object:',
            error
        );
    }

}


async function insertSubmissionFileRows(uploaded, submissionId) {

    const rows =
        uploaded.map(
            file => ({

                submission_id:
                    submissionId,

                file_name:
                    file.file_name,

                file_url:
                    file.file_url
                    || '',

                storage_path:
                    file.storage_path
                    || ''

            })
        );

    if (!rows.length) {
        return [];
    }

    let {
        data,
        error
    } =
        await db
            .from('wf_submission_files')
            .insert(rows)
            .select('*');

    if (
        error
        &&
        /column|schema|cache/i.test(
            error.message
            || ''
        )
    ) {

        const fallbackRows =
            uploaded.map(
                file => ({

                    submission_id:
                        submissionId,

                    file_name:
                        file.file_name

                })
            );

        const retry =
            await db
                .from('wf_submission_files')
                .insert(fallbackRows)
                .select('*');

        data =
            retry.data;

        error =
            retry.error;

    }

    if (error) {
        throw error;
    }

    return data || [];

}


async function refreshLocalSubmissionFiles(submissionId) {

    const {
        data,
        error
    } =
        await db
            .from('wf_submission_files')
            .select('*')
            .eq(
                'submission_id',
                submissionId
            );

    if (error) {
        throw error;
    }

    const rows =
        data
        || [];

    state.submissionFiles =
        state.submissionFiles
            .filter(
                file =>
                    String(file.submission_id)
                    !== String(submissionId)
            )
            .concat(rows);

    return rows;

}


async function uploadDraftsForSubmission({
    facultyId,
    taskId,
    submissionId,
    files
}) {

    let uploaded = [];

    try {

        uploaded =
            await uploadFilesToStorage({
                facultyId,
                taskId,
                submissionId,
                files
            });

    } catch (error) {

        if (
            String(
                error?.message
                || ''
            ).toLowerCase()
                .includes(
                    'storage bucket'
                )
        ) {

            uploaded =
                files.map(
                    file => ({

                        file_name:
                            file.name,

                        file_url:
                            '',

                        storage_path:
                            ''

                    })
                );

        } else {

            throw error;

        }

    }

    return insertSubmissionFileRows(
        uploaded,
        submissionId
    );

}


async function applyFacultyFileChangeStatus(task, submission, remainingCount) {

    if (!submission?.id) {
        return submission;
    }

    const update =
        window.CiteFlowWorkflow?.buildFacultyFileChangeUpdate
            ? CiteFlowWorkflow.buildFacultyFileChangeUpdate(
                submission,
                task,
                remainingCount
            )
            : (
                remainingCount
                    ? {
                        status: isPastDue(task) ? 'late' : 'submitted',
                        submitted_at: new Date().toISOString(),
                        is_late: isPastDue(task),
                        submitted_status: isPastDue(task) ? 'late' : 'on_time',
                        approval_stage: 'chairperson'
                    }
                    : {
                        status: 'notsubmitted',
                        submitted_at: null,
                        is_late: false,
                        submitted_status: null,
                        approval_stage: 'chairperson'
                    }
            );

    const {
        error
    } =
        await db
            .from('wf_submissions')
            .update(update)
            .eq(
                'id',
                submission.id
            );

    if (error) {
        throw error;
    }

    const idx =
        state.submissions.findIndex(
            row =>
                String(row.id)
                === String(submission.id)
        );

    if (idx >= 0) {
        state.submissions[idx] = {
            ...state.submissions[idx],
            ...update
        };
    }

    return {
        ...submission,
        ...update
    };

}


function assertCanManageFiles(task, submission) {

    if (

            submission,

            'error'
        );

        return false;

    }

    return true;

    await CiteFlowWorkflow.recordFacultyFileChange(db, {

        taskId: task?.id,
        submissionId: submission?.id,

    });

}


window.deleteDraftSubmissionFile = function deleteDraftSubmissionFile(taskId, index) {

    const drafts =
        getDraftFiles(taskId)
            .slice();

    if (
        index < 0
        ||
        index >= drafts.length
    ) {
        return;
    }

    drafts.splice(index, 1);

    if (drafts.length) {
        draftUploads[taskId] = drafts;
    } else {
        delete draftUploads[taskId];
    }

    selectedTaskId =
        String(taskId);

    renderDetailPage();

};

        );

    if (!input) {

    input.value = '';
    input.click();

};


window.deleteSavedSubmissionFile = async function deleteSavedSubmissionFile(taskId, fileId) {

    if (fileActionInProgress) {
        return;
    }

    const faculty =
        resolveCurrentFaculty();

    const task =
        getTaskById(taskId);

    const submission =
        faculty
            ? getSubmission(
                taskId,
                faculty.id
            )
            : null;

    if (
        !task
        ||
        !submission
        ||
        !assertCanManageFiles(task, submission)
    ) {
        return;
    }

    const confirmed =
        window.CiteFlowWorkflow?.confirmAction
            ? await CiteFlowWorkflow.confirmAction(
                'Delete this file from the submission? Admin will see the updated files.',
                'Delete file'
            )
            : confirm(
                'Delete this file from the submission?'
            );

    if (!confirmed) {
        return;
    }

    fileActionInProgress = true;

    try {

        const file =
            getSubmissionFileRecords(submission.id)
                .find(
                    row =>
                        String(row.id)
                        === String(fileId)
                );

        if (!file) {
            throw new Error(
                'That file is no longer attached to this submission.'
            );
        }

        await deleteStoragePath(
            file.storage_path
        );

        const {
            error
        } =
            await db
                .from('wf_submission_files')
                .delete()
                .eq(
                    'id',
                    fileId
                );

        if (error) {
            throw error;
        }

        const remaining =
            (
                await refreshLocalSubmissionFiles(
                    submission.id
                )
            ).length;

        const updatedSubmission =
            await applyFacultyFileChangeStatus(
                task,
                submission,
                remaining
            );

        await notifyFacultyFileChange(
            task,
            updatedSubmission,
            'deleted'
        );

        selectedTaskId =
            String(taskId);

        toastMessage(
            remaining
                ? 'File deleted. The submission was sent back for review.'
                : 'File deleted. This task is now marked as not submitted.',
            remaining ? 'success' : 'warn'
        );

        await fetchAllData();

    } catch (error) {

        console.error(
            'Failed to delete submission file:',
            error
        );

        toastMessage(
            error?.message
            || 'Failed to delete the file.',
            'error'
        );

    } finally {

        fileActionInProgress = false;

    }

};

};


async function replaceSavedSubmissionFileWith(taskId, fileId, nextFile) {

    if (fileActionInProgress) {
        return;
    }

    const faculty =
        resolveCurrentFaculty();

    const task =
        getTaskById(taskId);

    const submission =
        faculty
            ? getSubmission(
                taskId,
                faculty.id
            )
            : null;

    if (
        !faculty
        ||
        !task
        ||
        !submission
        ||
        !assertCanManageFiles(task, submission)
    ) {
        return;
    }

    fileActionInProgress = true;

    try {

        const file =
            getSubmissionFileRecords(submission.id)
                .find(
                    row =>
                        String(row.id)
                        === String(fileId)
                );

        if (!file) {
            throw new Error(
                'That file is no longer attached to this submission.'
            );
        }

        const inserted =
            await uploadDraftsForSubmission({
                facultyId: faculty.id,
                taskId,
                submissionId: submission.id,
                files: [nextFile]
            });

        await deleteStoragePath(
            file.storage_path
        );

        const {
            error
        } =
            await db
                .from('wf_submission_files')
                .delete()
                .eq(
                    'id',
                    fileId
                );

        if (error) {
            throw error;
        }

        const remaining =
            (
                await refreshLocalSubmissionFiles(
                    submission.id
                )
            ).length;

        const updatedSubmission =
            await applyFacultyFileChangeStatus(
                task,
                submission,
                remaining
            );

        await notifyFacultyFileChange(
            task,
            updatedSubmission,
            'replaced'
        );

        selectedTaskId =
            String(taskId);

        toastMessage(
            'File replaced. Admin can now review the new file.',
            'success'
        );

        await fetchAllData();

    } catch (error) {

        console.error(
            'Failed to replace submission file:',
            error
        );

        toastMessage(
            error?.message
            || 'Failed to replace the file.',
            'error'
        );

    } finally {

        fileActionInProgress = false;

    }

}


async function addSavedSubmissionFiles(taskId, files) {

    if (fileActionInProgress) {
        return;
    }

    const faculty =
        resolveCurrentFaculty();

    const task =
        getTaskById(taskId);

    const submission =
        faculty
            ? getSubmission(
                taskId,
                faculty.id
            )
            : null;

    if (
        !faculty
        ||
        !task
        ||
        !submission
        ||
        !assertCanManageFiles(task, submission)
    ) {
        return;
    }

    fileActionInProgress = true;

    try {

        const inserted =
            await uploadDraftsForSubmission({
                facultyId: faculty.id,
                taskId,
                submissionId: submission.id,
                files
            });

        const remaining =
            (
                await refreshLocalSubmissionFiles(
                    submission.id
                )
            ).length;

        const updatedSubmission =
            await applyFacultyFileChangeStatus(
                task,
                submission,
                remaining
            );

        await notifyFacultyFileChange(
            task,
            updatedSubmission,
            'added'
        );

        selectedTaskId =
            String(taskId);

        toastMessage(
            'File added. Admin can now review the updated submission.',
            'success'
        );

        await fetchAllData();

    } catch (error) {

        console.error(
            'Failed to add submission file:',
            error
        );

        toastMessage(
            error?.message
            || 'Failed to add the file.',
            'error'
        );

    } finally {

        fileActionInProgress = false;

    }

}


/* =========================================================
   SUBMIT TASK
========================================================= */

async function submitTask(taskId) {

    if (submitInProgress) {
        return;
    }

    const faculty =
        resolveCurrentFaculty();

    if (!faculty) {

        alert(
            'No matching active faculty profile found.'
        );

        return;
    }


    const task =
        getTaskById(taskId);

    if (!task) {
        return;
    }


    const submissionMethod =
        getSubmissionMethod(task);


    const files =
        getDraftFiles(taskId);


    const existingBeforeSubmit =
        getSubmission(
            taskId,
            faculty.id
        );


    if (
        isFileManagementLocked(
            existingBeforeSubmit,
            task
        )
    ) {

        toastMessage(
            'This submission is fully approved. Files can no longer be replaced or deleted.',
            'error'
        );

        return;

    }


    const submissionUrl =
        (
            draftSubmissionUrls[taskId]
            || ''
        ).trim();


    if (
        submissionMethod === 'upload'
        &&
        !files.length
    ) {

        const savedCount =
            existingBeforeSubmit
                ? getSubmissionFileRecords(
                    existingBeforeSubmit.id
                ).length
                : 0;

        if (!savedCount) {

            alert(
                'Please upload at least one file before submitting.'
            );

            return;

        }

    }


    if (
        submissionMethod === 'link'
        &&
        !submissionUrl
    ) {

        alert(
            'Please provide a submission URL.'
        );

        return;

    }


    submitInProgress = true;

    try {

        if (
            submissionMethod === 'link'
            &&
            !/^https?:\/\//i.test(submissionUrl)
        ) {

            throw new Error(
                'Please enter a valid URL starting with http:// or https://'
            );

        }


        const now =
            new Date().toISOString();


        const late =
            isPastDue(task);


        const existingSubmission =
            getSubmission(
                taskId,
                faculty.id
            );


        const payload = {

            task_id:
                taskId,

            faculty_id:
                faculty.id,

            submitted_at:
                now,

            status:
                late
                    ? 'late'
                    : 'submitted',

            is_late:
                late,

            submitted_status:
                late
                    ? 'late'
                    : 'on_time',

            reviewed_by_name:
                null,

            reviewed_at:
                null,

            review_remarks:
                '',

            approval_stage:
                'chairperson'

        };


        /*
        ------------------------------------------------------
        Resubmission tracking
        ------------------------------------------------------
        */

        if (
            existingSubmission
            &&
            [
                'revision',
                'rejected'
            ].includes(
                String(
                    existingSubmission.status
                    || ''
                ).toLowerCase()
            )
        ) {

            payload.resubmission_count =
                Number(
                    existingSubmission.resubmission_count
                    || 0
                ) + 1;

        }


        const {
            data: savedSubmission,
            error: saveError
        } =
            await db
                .from('wf_submissions')
                .upsert(
                    payload,
                    {
                        onConflict:
                            'task_id,faculty_id'
                    }
                )
                .select('id')
                .single();


        if (saveError) {
            throw saveError;
        }


        const submissionId =
            savedSubmission?.id;


        if (!submissionId) {

            throw new Error(
                'Submission was saved, but no submission ID was returned.'
            );

        }


        /*
        ------------------------------------------------------
        File upload method
        ------------------------------------------------------
        */

        if (
            submissionMethod === 'upload'
            &&
            files.length
        ) {

            await uploadDraftsForSubmission({
                facultyId: faculty.id,
                taskId,
                submissionId,
                files
            });

        }


        /*
        ------------------------------------------------------
        Link submission
        ------------------------------------------------------
        |
        | The URL is saved into wf_submission_files as a
        | submission record if file_url is available.
        |
        */

        if (
            submissionMethod === 'link'
        ) {

            const {
                error: deleteOldLink
            } =
                await db
                    .from('wf_submission_files')
                    .delete()
                    .eq(
                        'submission_id',
                        submissionId
                    );


            if (deleteOldLink) {
                console.warn(deleteOldLink);
            }


            let {
                error: linkError
            } =
                await db
                    .from('wf_submission_files')
                    .insert({

                        submission_id:
                            submissionId,

                        file_name:
                            'External Submission Link',

                        file_url:
                            submissionUrl,

                        storage_path:
                            ''

                    });


            if (
                linkError
                &&
                /column|schema|cache/i.test(
                    linkError.message
                    || ''
                )
            ) {

                linkError =
                    new Error(
                        'Your wf_submission_files table needs a file_url column to save link submissions.'
                    );

            }


            if (linkError) {
                throw linkError;
            }

        }


        /*
        ------------------------------------------------------
        Activity log + notification + approval history
        ------------------------------------------------------
        */

        if (window.CiteFlowWorkflow) {
            await CiteFlowWorkflow.recordSubmissionEvent(db, {
                faculty,
                task,
                taskId,
                submissionId,
                isResubmit: Boolean(
                    existingSubmission &&
                    ['revision', 'rejected'].includes(String(existingSubmission.status || '').toLowerCase())
                )
            });
        } else {
            const notificationResult = await db.from('wf_notifications').insert({
                type: 'submission',
                faculty_id: faculty.id,
                task_id: taskId,
                message: `New submission from ${faculty.full_name}: ${task.title}`,
                is_read: false
            });
            if (notificationResult.error) {
                console.warn('Notification could not be created:', notificationResult.error);
            }
            const activityResult = await db.from('wf_activity_log').insert({
                action: existingSubmission ? 'Resubmitted task' : 'Submitted task',
                actor_name: faculty.full_name,
                target: task.title,
                log_type: 'submission',
                task_id: taskId,
                submission_id: submissionId
            });
            if (activityResult.error) {
                console.warn('Activity log could not be created:', activityResult.error);
            }
        }


        delete draftUploads[taskId];

        delete draftSubmissionUrls[taskId];


        selectedTaskId =
            String(taskId);


        await fetchAllData();

        const statusLabel = window.CiteFlowWorkflow
            ? CiteFlowWorkflow.formatWorkflowStatus(
                { status: late ? 'late' : 'submitted', approval_stage: 'chairperson', submitted_at: now },
                task
            )
            : 'Submitted — Pending Chairperson Review';

        if (window.CiteFlowWorkflow) {
            CiteFlowWorkflow.showToast(
                late
                    ? `Submission sent (late). ${statusLabel}`
                    : `Submission sent successfully. ${statusLabel}`,
                'success'
            );
        } else {
            alert(
                late
                    ? 'Submission sent successfully. It was recorded as a late submission.'
                    : 'Submission sent successfully for review.'
            );
        }


    } catch (error) {

        console.error(
            'Submission failed:',
            error
        );

        if (window.CiteFlowWorkflow) {
            CiteFlowWorkflow.showToast(
                error?.message || 'Submission failed.',
                'error'
            );
        } else {
            alert(
                error?.message
                || 'Submission failed.'
            );
        }

    } finally {
        submitInProgress = false;
    }

}


function refreshNavNotifications() {
    if (typeof window.refreshFacultyNavNotifications !== 'function') {
        return;
    }

    const faculty = resolveCurrentFaculty();
    const filtered = (state.notifications || []).filter((notification) => {
        if (!faculty) return true;
        if (notification.faculty_id != null) {
            return String(notification.faculty_id) === String(faculty.id);
        }
        return true;
    });

    window.refreshFacultyNavNotifications(filtered);
}


/* =========================================================
   FETCH DATA
========================================================= */

async function fetchAllData() {

    if (isFetchingData) {
        pendingDataRefresh = true;
        return;
    }


    isFetchingData =
        true;
    pendingDataRefresh = false;


    const root =
        document.getElementById(
            'appRoot'
        );


    try {

        const ok =
            await requireFacultyAuth();


        if (!ok) {
            return;
        }


        currentFaculty =
            await loadCurrentFacultyProfile();


        setSidebarFaculty(
            currentFaculty,
            currentUser
        );


        if (!currentFaculty) {

            root.innerHTML = `

                ${renderTopBar(
                    'Submission Tasks',
                    'Faculty profile not found.'
                )}

                <div
                    class="
                        rounded-3xl
                        p-6
                        bg-white
                        border
                        border-amber-200
                        text-amber-800
                    "
                >
                    Your account is signed in, but no matching faculty profile was found.
                    Please ask the administrator to link your login to a faculty profile.
                </div>

            `;

            return;

        }

        if (currentFaculty.is_active === false) {
            console.warn('Faculty profile is inactive, but assigned tasks will still be shown.');
        }


        const facultyId = currentFaculty.id;

        let assignmentRows = [];
        let taskRows = [];

        if (window.CiteFlowWorkflow) {
            const bundle = await CiteFlowWorkflow.loadFacultyAssignedTasks(facultyId);
            if (bundle.error) {
                root.innerHTML = `
                    ${renderTopBar('Submission Tasks', 'There was a problem loading your tasks.')}
                    <div class="rounded-3xl p-6 bg-white border border-red-100 text-red-600">
                        ${escapeHtml(bundle.error.message || 'Failed to load assigned tasks.')}
                    </div>
                `;
                return;
            }
            assignmentRows = bundle.assignments;
            taskRows = bundle.tasks;
        } else {
            const [tasks, assignments] = await Promise.all([
                db.from('wf_tasks').select('*').order('created_at', { ascending: false }),
                db.from('wf_task_assignments').select('*').eq('faculty_id', facultyId)
            ]);

            if (tasks.error || assignments.error) {
                const message =
                    tasks.error?.message
                    || assignments.error?.message
                    || 'Failed to load submission data.';

                root.innerHTML = `
                    ${renderTopBar('Submission Tasks', 'There was a problem loading your tasks.')}
                    <div class="rounded-3xl p-6 bg-white border border-red-100 text-red-600">
                        ${escapeHtml(message)}
                    </div>
                `;
                return;
            }

            assignmentRows = assignments.data || [];
            const assignmentTaskIds = new Set(assignmentRows.map(a => String(a.task_id)));
            taskRows = (tasks.data || []).filter(task => assignmentTaskIds.has(String(task.id)));
        }

        const [
            submissions,
            files,
            notifications
        ] = await Promise.all([
            db.from('wf_submissions').select('*').eq('faculty_id', facultyId),
            db.from('wf_submission_files').select('*'),
            db
                .from('wf_notifications')
                .select('*')
                .or(`faculty_id.eq.${facultyId},faculty_id.is.null`)
                .order('created_at', { ascending: false })
                .limit(100)
        ]);

        if (submissions.error) {

            const message =
                submissions.error?.message
                || 'Failed to load submission data.';


            root.innerHTML = `

                ${renderTopBar(
                    'Submission Tasks',
                    'There was a problem loading your tasks.'
                )}

                <div
                    class="
                        rounded-3xl
                        p-6
                        bg-white
                        border
                        border-red-100
                        text-red-600
                    "
                >
                    ${escapeHtml(message)}
                </div>

            `;

            return;

        }


        if (
            files.error
            ||
            notifications.error
        ) {

            console.warn(
                'Optional submission data could not be loaded:',
                {
                    files,
                    notifications
                }
            );

        }


        state.faculty = [currentFaculty];

        state.tasks = taskRows;


        state.assignments = assignmentRows;


        state.submissions =
            submissions.data
            || [];

        const submissionIds = new Set(state.submissions.map(s => String(s.id)));


        state.submissionFiles =
            files.error
                ? []
                : (
                    (files.data || []).filter(f => submissionIds.has(String(f.submission_id)))
                );


        state.notifications =
            notifications.error
                ? []
                : (
                    notifications.data
                    || []
                );


        if (
            currentView === 'detail'
            &&
            selectedTaskId
        ) {

            renderDetailPage();

        } else {

            renderListPage();

        }

        refreshNavNotifications();


    } catch (error) {

        console.error(
            'Failed to fetch submission data:',
            error
        );


        root.innerHTML = `

            ${renderTopBar(
                'Submission Tasks',
                'There was a problem loading your submission data.'
            )}

            <div
                class="
                    rounded-3xl
                    p-6
                    bg-white
                    border
                    border-red-100
                    text-red-600
                "
            >
                ${escapeHtml(
                    error?.message
                    || 'Unexpected error.'
                )}
            </div>

        `;

    } finally {

        isFetchingData =
            false;

        if (pendingDataRefresh) {
            pendingDataRefresh = false;
            fetchAllData();
        }

    }

}

/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value) {

    return String(value ?? '').replace(
        /[&<>'"]/g,
        ch => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            "'": '&#39;',
            '"': '&quot;'
        }[ch])
    );

}


function formatDate(iso) {

    if (!iso) {
        return 'No due date';
    }

    return new Date(iso).toLocaleDateString(
        'en-US',
        {
            month: 'short',
            day: 'numeric',
            year: 'numeric'
        }
    );

}


function formatDateTime(iso) {

    if (!iso) {
        return 'No deadline';
    }

    return new Date(iso).toLocaleString(
        'en-US',
        {
            month: 'short',
            day: 'numeric',
            year: 'numeric',
            hour: 'numeric',
            minute: '2-digit'
        }
    );

}


/*
|--------------------------------------------------------------------------
| Effective deadline
|--------------------------------------------------------------------------
|
| New recurring tasks use deadline_at.
| Old/regular tasks can continue using due_at.
|
*/

function getTaskDeadline(task) {

    return task?.deadline_at
        || task?.due_at
        || null;

}


function isPastDueDate(iso) {

    if (!iso) {
        return false;
    }

    return new Date(iso).getTime() < Date.now();

}


function isPastDue(task) {

    return isPastDueDate(
        getTaskDeadline(task)
    );

}


function daysUntil(task) {

    const deadline = getTaskDeadline(task);

    if (!deadline) {
        return null;
    }

    return Math.ceil(
        (
            new Date(deadline).getTime()
            - Date.now()
        )
        / 86400000
    );

}


function getTaskById(id) {

    return state.tasks.find(
        task =>
            String(task.id) === String(id)
    );

}


function getSubmission(taskId, facultyId) {

    return state.submissions.find(
        submission =>
            String(submission.task_id) === String(taskId)
            &&
            String(submission.faculty_id) === String(facultyId)
    );

}


function getSubmissionFiles(submissionId) {

    return state.submissionFiles
        .filter(
            file =>
                String(file.submission_id)
                === String(submissionId)
        )
        .map(
            file => file.file_name
        );

}


function getDraftFiles(taskId) {

    return Array.isArray(
        draftUploads[taskId]
    )
        ? draftUploads[taskId]
        : [];

}


function getDraftFileNames(taskId) {

    return getDraftFiles(taskId)
        .map(file => file?.name)
        .filter(Boolean);

}


/* =========================================================
   SUBMISSION METHOD
========================================================= */

function getSubmissionMethod(task) {

    const method = String(
        task?.submission_method
        || 'upload'
    )
        .trim()
        .toLowerCase();

    if (
        [
            'link',
            'url',
            'external',
            'external_link'
        ].includes(method)
    ) {
        return 'link';
    }

    return 'upload';

}


function getSubmissionMethodLabel(task) {

    return getSubmissionMethod(task) === 'link'
        ? 'Link Submission'
        : 'File Upload';

}


/* =========================================================
   REPORTING PERIOD
========================================================= */

function getReportingPeriodText(task) {

    if (task.reporting_period_label) {
        return task.reporting_period_label;
    }

    if (
        task.reporting_period_start
        &&
        task.reporting_period_end
    ) {
        return `${formatDate(task.reporting_period_start)} – ${formatDate(task.reporting_period_end)}`;
    }

    if (task.generated_for_period) {
        return task.generated_for_period;
    }

    return 'Current reporting period';

}


function normalizeFacultyForSubmissions(row) {

    return {
        ...row,

        id: row.id,

        auth_user_id:

            || null,

        full_name:
            row.full_name
            || row.name
            || row.email
            || 'Faculty Member',

        department_code:

            || row.department_code
            || 'N/A',

        is_active:
            row.access_enabled !== false
            &&
            String(
                row.status
                || 'Active'
            ).toLowerCase() === 'active'

}

/* =========================================================
   AUTHENTICATION
========================================================= */

async function requireFacultyAuth() {

    if (
        authChecked
        &&
        currentUser
    ) {
        return true;
    }

    const {
        data,
        error
    } =
        await db.auth.getSession();

    if (
        error
        ||
        !data?.session?.user
    ) {
        window.location.href =
            '../login.html';

        return false;
    }

    const user =
        data.session.user;

    const role =
        String(
            user.user_metadata?.role
            || ''
        ).toLowerCase();

    if (
        role
        &&
        role !== 'faculty'
    ) {

        await db.auth.signOut();

        window.location.href =
            '../login.html';

        return false;
    }

    currentUser = user;

    authChecked = true;

    return true;

}


/* =========================================================
   LOAD FACULTY PROFILE
========================================================= */

async function loadCurrentFacultyProfile() {

    if (!currentUser) {
        return null;
    }

    const email =
        String(
            currentUser.email
            || ''
        ).toLowerCase();

    let response =
        await db
            .from('faculty')
            .select('*')
            .eq(
                'auth_user_id',
                currentUser.id
            )
            .maybeSingle();

    if (response.error) {
        console.error(
            'Failed to load faculty profile:',
            response.error
        );
    }

    if (
        !response.data
        &&
        email
    ) {

        response =
            await db
                .from('faculty')
                .select('*')
                .or(
                    `email.eq.${email},existing_email.eq.${email}`
                )
                .maybeSingle();

    }

    if (!response.data) {
        return null;
    }

    const normalized =
        normalizeFacultyForSubmissions(
            response.data
        );

    return normalized.is_active
        ? normalized
        : null;

}


/* =========================================================
   STATUS
========================================================= */

function effectiveStatus(task, submission) {

    if (!submission) {

        return isPastDue(task)
            ? 'Late'
            : 'Not Submitted';

    }

    const rawStatus =
        String(
            submission.status
            || ''
        ).toLowerCase();

    if (
        rawStatus === 'notsubmitted'
        &&
        isPastDue(task)
    ) {
        return 'Late';
    }

    const map = {

        submitted: 'Submitted',

        late: 'Late',

        underreview: 'Under Review',

        pending: 'Under Review',

        approved: 'Approved',

        rejected: 'Rejected',

        revision: 'Returned for Revision',

        notsubmitted: 'Not Submitted'

    };

    return map[rawStatus]
        || 'Not Submitted';

}


function isActionable(status) {

    return [
        'Not Submitted',
        'Returned for Revision',
        'Late',
        'Rejected'
    ].includes(status);

}


function isSubmittedStatus(status) {

    return [
        'Submitted',
        'Under Review',
        'Approved'
    ].includes(status);

}


function statusClass(status) {

    const map = {

        'Not Submitted':
            'bg-slate-100 text-slate-700 ring-1 ring-slate-200',

        'Submitted':
            'bg-blue-50 text-blue-700 ring-1 ring-blue-100',

        'Late':
            'bg-red-50 text-red-700 ring-1 ring-red-100',

        'Under Review':
            'bg-indigo-50 text-indigo-700 ring-1 ring-indigo-100',

        'Approved':
            'bg-emerald-50 text-emerald-700 ring-1 ring-emerald-100',

        'Rejected':
            'bg-slate-200 text-slate-700 ring-1 ring-slate-300',

        'Returned for Revision':
            'bg-amber-50 text-amber-700 ring-1 ring-amber-100'

    };

    return map[status]
        || map['Not Submitted'];

}


/* =========================================================
   DEADLINE INDICATOR
========================================================= */

function dueIndicator(task, status) {

    if (status === 'Approved') {

        return {
            color: 'bg-emerald-500',
            tone:
                'bg-emerald-50 text-emerald-700 ring-emerald-100',
            label: 'Approved',
            caption:
                'Completed and approved'
        };

    }

    const d =
        daysUntil(task);

    if (d === null) {

        return {
            color: 'bg-slate-300',
            tone:
                'bg-slate-50 text-slate-600 ring-slate-100',
            label: 'No deadline',
            caption:
                'No deadline set'
        };

    }

    if (d <= 0) {

        return {
            color: 'bg-red-500',
            tone:
                'bg-red-50 text-red-700 ring-red-100',
            label: 'Past due',
            caption:
                'The submission deadline has passed'
        };

    }

    if (d <= 1) {

        return {
            color: 'bg-red-500',
            tone:
                'bg-red-50 text-red-700 ring-red-100',
            label: '24 hrs left',
            caption:
                'Due within 24 hours'
        };

    }

    if (d <= 3) {

        return {
            color: 'bg-amber-400',
            tone:
                'bg-amber-50 text-amber-700 ring-amber-100',
            label:
                `${d} days left`,
            caption:
                'Deadline approaching'
        };

    }

    return {

        color: 'bg-slate-300',

        tone:
            'bg-slate-50 text-slate-600 ring-slate-100',

        label:
            `${d} days left`,

        caption:
            'On schedule'

    };

}


/* =========================================================
   ASSIGNED TASKS
========================================================= */

function getAssignedModels() {

    const faculty =
        resolveCurrentFaculty();

    if (!faculty) {
        return [];
    }

    const assignedTaskIds =
        state.assignments
            .filter(
                assignment =>
                    String(
                        assignment.faculty_id
                    )
                    ===
                    String(faculty.id)
            )
            .map(
                assignment =>
                    String(
                        assignment.task_id
                    )
            );

    return state.tasks
        .filter(
            task =>
                assignedTaskIds.includes(
                    String(task.id)
                )
        )
        .map(task => {

            const submission =
                getSubmission(
                    task.id,
                    faculty.id
                );

            const status =
                effectiveStatus(
                    task,
                    submission
                );

            const files =
                draftUploads[task.id]
                ||
                (
                    submission
                        ? getSubmissionFiles(
                            submission.id
                        )
                        : []
                );

            return {

                task,

                sub: submission,

                status,

                files,

                indicator:
                    dueIndicator(
                        task,
                        status
                    )

            };

        });

}


/* =========================================================
   FILTERING
========================================================= */

function getVisibleModels() {

    const query =
        (
            document
                .getElementById(
                    'taskSearch'
                )
                ?.value
            || window.__lastSearch
            || ''
        )
            .toLowerCase()
            .trim();

    return getAssignedModels()
        .filter(model => {

            const matchesFilter =

                currentFilter === 'all'

                ||

                (
                    currentFilter === 'pending'
                    &&
                    isActionable(
                        model.status
                    )
                )

                ||

                (
                    currentFilter === 'submitted'
                    &&
                    isSubmittedStatus(
                        model.status
                    )
                )

                ||

                (
                    currentFilter === 'recurring'
                    &&
                    model.task.is_recurring
                );

            const haystack =
                [
                    model.task.title,
                    model.task.instructions,
                    model.status,
                    model.task.reporting_period_label,
                    model.task.generated_for_period,
                    model.task.assigned_label
                ]
                    .join(' ')
                    .toLowerCase();

            return (
                matchesFilter
                &&
                (
                    !query
                    ||
                    haystack.includes(query)
                )
            );

        });

}

function wireUploadInputs() {

    document
        .querySelectorAll(
            '.task-upload-input'
        )
        .forEach(input => {

            input.addEventListener(
                'change',
                event => {

                    const taskId =
                        event.target.dataset.task;

                    draftUploads[taskId] =
                        Array
                            .from(
                                event.target.files
                                || []
                            )
                            .filter(Boolean);

                    selectedTaskId =
                        String(taskId);

                    renderDetailPage();

                }
            );

        });

}


/* =========================================================
   SUBMISSION URL INPUT
========================================================= */

function wireSubmissionUrlInput() {

    const input =
        document.getElementById(
            'submissionUrlInput'
        );

    if (!input) {
        return;
    }

    input.addEventListener(
        'input',
        event => {

            if (!selectedTaskId) {
                return;
            }

            draftSubmissionUrls[selectedTaskId] =
                event.target.value;

            const button =
                document.querySelector(
                    'button[onclick^="submitTask"]'
                );

            if (button) {

                button.disabled =
                    !event.target.value.trim();

            }

        }
    );

}


/* =========================================================
   FILE STORAGE
========================================================= */

function sanitizeFileName(name) {

    return String(
        name
        || 'file'
    )
        .replace(
            /[^a-zA-Z0-9.\-_]/g,
            '_'
        );

}


function isStorageBucketMissingError(error) {

    const message =
        String(
            error?.message
            || ''
        ).toLowerCase();

    return (
        message.includes('bucket')
        &&
        message.includes('not found')
    );

}


async function uploadFilesToStorage({
    facultyId,
    taskId,
    submissionId,
    files
}) {

    const uploaded = [];

    for (const file of files) {

        const safeName =
            sanitizeFileName(
                file.name
            );

        const path =
            `${facultyId}/${taskId}/${submissionId}/${Date.now()}-${safeName}`;


        const {
            error: uploadError
        } =
            await db
                .storage
                .from(submissionBucket)
                .upload(
                    path,
                    file,
                    {
                        upsert: true,
                        contentType:
                            file.type
                            || undefined
                    }
                );


        if (uploadError) {

            if (
                isStorageBucketMissingError(
                    uploadError
                )
            ) {

                throw new Error(
                    `Storage bucket "${submissionBucket}" is missing.`
                );

            }

            throw uploadError;

        }


        const {
            data
        } =
            db
                .storage
                .from(submissionBucket)
                .getPublicUrl(path);


        uploaded.push({

            file_name:
                file.name,

            file_url:
                data?.publicUrl
                || '',

            storage_path:
                path

        });

    }

    return uploaded;

}


/* =========================================================
   SUBMIT TASK
========================================================= */

async function submitTask(taskId) {

    const faculty =
        resolveCurrentFaculty();

    if (!faculty) {

        alert(
            'No matching active faculty profile found.'
        );

        return;
    }


    const task =
        getTaskById(taskId);

    if (!task) {
        return;
    }


    const submissionMethod =
        getSubmissionMethod(task);


    const files =
        getDraftFiles(taskId);


    const submissionUrl =
        (
            draftSubmissionUrls[taskId]
            || ''
        ).trim();


    if (
        submissionMethod === 'upload'
        &&
        !files.length
    ) {

        alert(
            'Please upload at least one file before submitting.'
        );

        return;

    }


    if (
        submissionMethod === 'link'
        &&
        !submissionUrl
    ) {

        alert(
            'Please provide a submission URL.'
        );

        return;

    }


    try {

        if (
            submissionMethod === 'link'
            &&
            !/^https?:\/\//i.test(submissionUrl)
        ) {

            throw new Error(
                'Please enter a valid URL starting with http:// or https://'
            );

        }


        const now =
            new Date().toISOString();


        const late =
            isPastDue(task);


        const existingSubmission =
            getSubmission(
                taskId,
                faculty.id
            );


        const payload = {

            task_id:
                taskId,

            faculty_id:
                faculty.id,

            submitted_at:
                now,

            status:
                late
                    ? 'late'
                    : 'submitted',

            is_late:
                late,

            submitted_status:
                late
                    ? 'late'
                    : 'on_time',

            reviewed_by_name:
                null,

            reviewed_at:
                null,

            review_remarks:
                '',

            approval_stage:
                'chairperson'

        };


        /*
        ------------------------------------------------------
        Resubmission tracking
        ------------------------------------------------------
        */

        if (
            existingSubmission
            &&
            [
                'revision',
                'rejected'
            ].includes(
                String(
                    existingSubmission.status
                    || ''
                ).toLowerCase()
            )
        ) {

            payload.resubmission_count =
                Number(
                    existingSubmission.resubmission_count
                    || 0
                ) + 1;

        }


        const {
            data: savedSubmission,
            error: saveError
        } =
            await db
                .from('wf_submissions')
                .upsert(
                    payload,
                    {
                        onConflict:
                            'task_id,faculty_id'
                    }
                )
                .select('id')
                .single();


        if (saveError) {
            throw saveError;
        }


        const submissionId =
            savedSubmission?.id;


        if (!submissionId) {

            throw new Error(
                'Submission was saved, but no submission ID was returned.'
            );

        }


        /*
        ------------------------------------------------------
        File upload method
        ------------------------------------------------------
        */

        if (
            submissionMethod === 'upload'
        ) {

            const {
                error: deleteFilesError
            } =
                await db
                    .from('wf_submission_files')
                    .delete()
                    .eq(
                        'submission_id',
                        submissionId
                    );


            if (deleteFilesError) {
                console.warn(
                    'Unable to remove old submission files:',
                    deleteFilesError
                );
            }


            let uploaded = [];

            let savedWithoutStorage =
                false;


            try {

                uploaded =
                    await uploadFilesToStorage({

                        facultyId:
                            faculty.id,

                        taskId,

                        submissionId,

                        files

                    });

            } catch (error) {

                if (
                    String(
                        error?.message
                        || ''
                    ).toLowerCase()
                        .includes(
                            'storage bucket'
                        )
                ) {

                    uploaded =
                        files.map(
                            file => ({

                                file_name:
                                    file.name,

                                file_url:
                                    '',

                                storage_path:
                                    ''

                            })
                        );

                    savedWithoutStorage =
                        true;

                } else {

                    throw error;

                }

            }


            const rows =
                uploaded.map(
                    file => ({

                        submission_id:
                            submissionId,

                        file_name:
                            file.file_name,

                        file_url:
                            file.file_url
                            || '',

                        storage_path:
                            file.storage_path
                            || ''

                    })
                );


            if (rows.length) {

                let {
                    error: filesError
                } =
                    await db
                        .from('wf_submission_files')
                        .insert(rows);


                /*
                ------------------------------------------------
                Fallback if file_url/storage_path columns
                do not exist yet.
                ------------------------------------------------
                */

                if (
                    filesError
                    &&
                    /column|schema|cache/i.test(
                        filesError.message
                        || ''
                    )
                ) {

                    const fallbackRows =
                        uploaded.map(
                            file => ({

                                submission_id:
                                    submissionId,

                                file_name:
                                    file.file_name

                            })
                        );


                    const retry =
                        await db
                            .from('wf_submission_files')
                            .insert(
                                fallbackRows
                            );

                    filesError =
                        retry.error;

                }


                if (filesError) {
                    throw filesError;
                }

            }


            if (savedWithoutStorage) {

                console.warn(
                    'Submission saved without storage file previews.'
                );

            }

        }


        /*
        ------------------------------------------------------
        Link submission
        ------------------------------------------------------
        |
        | The URL is saved into wf_submission_files as a
        | submission record if file_url is available.
        |
        */

        if (
            submissionMethod === 'link'
        ) {

            const {
                error: deleteOldLink
            } =
                await db
                    .from('wf_submission_files')
                    .delete()
                    .eq(
                        'submission_id',
                        submissionId
                    );


            if (deleteOldLink) {
                console.warn(deleteOldLink);
            }


            let {
                error: linkError
            } =
                await db
                    .from('wf_submission_files')
                    .insert({

                        submission_id:
                            submissionId,

                        file_name:
                            'External Submission Link',

                        file_url:
                            submissionUrl,

                        storage_path:
                            ''

                    });


            if (
                linkError
                &&
                /column|schema|cache/i.test(
                    linkError.message
                    || ''
                )
            ) {

                linkError =
                    new Error(
                        'Your wf_submission_files table needs a file_url column to save link submissions.'
                    );

            }


            if (linkError) {
                throw linkError;
            }

        }


        /*
        ------------------------------------------------------
        Notification
        ------------------------------------------------------
        */

        const notificationResult =
            await db
                .from('wf_notifications')
                .insert({

                    type:
                        'submission',

                    faculty_id:
                        faculty.id,

                    task_id:
                        taskId,

                    message:
                        `New submission from ${faculty.full_name}: ${task.title}`,

                    is_read:
                        false

                });


        if (notificationResult.error) {
            console.warn(
                'Notification could not be created:',
                notificationResult.error
            );
        }


        /*
        ------------------------------------------------------
        Activity log
        ------------------------------------------------------
        */

        const activityResult =
            await db
                .from('wf_activity_log')
                .insert({

                    action:
                        existingSubmission
                            ? 'Resubmitted task'
                            : 'Submitted task',

                    actor_name:
                        faculty.full_name,

                    target:
                        task.title,

                    log_type:
                        'submission'

                });


        if (activityResult.error) {
            console.warn(
                'Activity log could not be created:',
                activityResult.error
            );
        }


        delete draftUploads[taskId];

        delete draftSubmissionUrls[taskId];


        selectedTaskId =
            String(taskId);


        await fetchAllData();


        alert(
            late

                ?

                'Submission sent successfully. It was recorded as a late submission.'

                :

                'Submission sent successfully for review.'
        );


    } catch (error) {

        console.error(
            'Submission failed:',
            error
        );

        alert(
            error?.message
            || 'Submission failed.'
        );

    }

}


/* =========================================================
   NOTIFICATIONS
========================================================= */

function getFacultyNotifications() {

    const faculty =
        resolveCurrentFaculty();

    if (!faculty) {
        return [];
    }

    return (
        state.notifications
        || []
    ).filter(
        notification => {

            if (
                String(
                    notification.faculty_id
                    || ''
                )
                ===
                String(faculty.id)
            ) {
                return true;
            }

            return (
                notification.message
                &&
                notification.message.includes(
                    faculty.full_name
                )
            );

        }
    );

}


function renderNotifications() {

    const list =
        document.getElementById(
            'notifList'
        );

    if (!list) {
        return;
    }


    const items =
        getFacultyNotifications();


    if (!items.length) {

        list.innerHTML = `
            <p
                class="
                    text-sm
                    text-gray-400
                    text-center
                    py-4
                "
            >
                No notifications yet
            </p>
        `;

        return;

    }


    list.innerHTML =
        items
            .map(
                notification => `

                    <div
                        class="
                            dropdown-item
                            ${
                                notification.is_read
                                    ? ''
                                    : 'bg-blue-50'
                            }
                        "
                    >

                        <div class="flex-1">

                            <div
                                class="
                                    text-sm
                                    text-gray-800
                                "
                            >
                                ${escapeHtml(notification.message)}
                            </div>


                            <div
                                class="
                                    text-xs
                                    text-gray-400
                                    mt-0.5
                                "
                            >
                                ${formatDate(notification.created_at)}
                            </div>

                        </div>


                        ${
                            notification.is_read

                                ?

                                ''

                                :

                                `
                                <div
                                    class="
                                        w-2
                                        h-2
                                        bg-blue-500
                                        rounded-full
                                    "
                                ></div>
                                `
                        }

                    </div>

                `
            )
            .join('');

}


function updateNotifBadge() {

    unreadNotifications =
        getFacultyNotifications()
            .filter(
                notification =>
                    !notification.is_read
            )
            .length;


    const badge =
        document.getElementById(
            'notifBadge'
        );


    if (!badge) {
        return;
    }


    if (
        unreadNotifications > 0
    ) {

        badge.style.display =
            'flex';

        badge.textContent =
            unreadNotifications > 99
                ? '99+'
                : String(
                    unreadNotifications
                );

    } else {

        badge.style.display =
            'none';

    }

}


function toggleNotifications() {

    document
        .getElementById(
            'notifDropdown'
        )
        ?.classList
        .toggle('open');

}


async function markFacultyNotificationsRead() {

    const ids =
        getFacultyNotifications()
            .filter(
                notification =>
                    !notification.is_read
            )
            .map(
                notification =>
                    notification.id
            );


    if (!ids.length) {
        return;
    }


    const {
        error
    } =
        await db
            .from('wf_notifications')
            .update({
                is_read: true
            })
            .in(
                'id',
                ids
            );


    if (error) {

        alert(
            error.message
        );

        return;

    }


    await fetchAllData();

}


/* =========================================================
   FETCH DATA
========================================================= */

async function fetchAllData() {

    if (isFetchingData) {
        return;
    }


    isFetchingData =
        true;


    const root =
        document.getElementById(
            'appRoot'
        );


    try {

        const ok =
            await requireFacultyAuth();


        if (!ok) {
            return;
        }


        currentFaculty =
            await loadCurrentFacultyProfile();


        setSidebarFaculty(
            currentFaculty,
            currentUser
        );


        if (!currentFaculty) {

            root.innerHTML = `

                ${renderTopBar(
                    'Submission Tasks',
                    'Faculty profile not found.'
                )}

                <div
                    class="
                        rounded-3xl
                        p-6
                        bg-white
                        border
                        border-amber-200
                        text-amber-800
                    "
                >
                    Your account is signed in, but no matching active faculty profile was found.
                    Please ask the administrator to check your faculty profile.
                </div>

            `;

            return;

        }


        const [
            faculty,
            tasks,
            assignments,
            submissions,
            files,
            notifications
        ] =
            await Promise.all([

                db
                    .from('faculty')
                    .select('*')
                    .order(
                        'full_name',
                        {
                            ascending: true
                        }
                    ),

                db
                    .from('wf_tasks')
                    .select('*')
                    .order(
                        'created_at',
                        {
                            ascending: false
                        }
                    ),

                db
                    .from('wf_task_assignments')
                    .select('*'),

                db
                    .from('wf_submissions')
                    .select('*'),

                db
                    .from('wf_submission_files')
                    .select('*'),

                db
                    .from('wf_notifications')
                    .select('*')
                    .order(
                        'created_at',
                        {
                            ascending: false
                        }
                    )
                    .limit(100)

            ]);


        if (
            faculty.error
            ||
            tasks.error
            ||
            assignments.error
            ||
            submissions.error
        ) {

            const message =

                faculty.error?.message

                ||

                tasks.error?.message

                ||

                assignments.error?.message

                ||

                submissions.error?.message

                ||

                'Failed to load submission data.';


            root.innerHTML = `

                ${renderTopBar(
                    'Submission Tasks',
                    'There was a problem loading your tasks.'
                )}

                <div
                    class="
                        rounded-3xl
                        p-6
                        bg-white
                        border
                        border-red-100
                        text-red-600
                    "
                >
                    ${escapeHtml(message)}
                </div>

            `;

            return;

        }


        if (
            files.error
            ||
            notifications.error
        ) {

            console.warn(
                'Optional submission data could not be loaded:',
                {
                    files,
                    notifications
                }
            );

        }


        state.faculty =
            (
                faculty.data
                || []
            )
                .map(
                    normalizeFacultyForSubmissions
                )
                .filter(
                    facultyMember =>
                        facultyMember.is_active
                );


        state.tasks =
            tasks.data
            || [];


        state.assignments =
            assignments.data
            || [];


        state.submissions =
            submissions.data
            || [];


        state.submissionFiles =
            files.error
                ? []
                : (
                    files.data
                    || []
                );


        state.notifications =
            notifications.error
                ? []
                : (
                    notifications.data
                    || []
                );


        if (
            currentView === 'detail'
            &&
            selectedTaskId
        ) {

            renderDetailPage();

        } else {

            renderListPage();

        }


    } catch (error) {

        console.error(
            'Failed to fetch submission data:',
            error
        );


        root.innerHTML = `

            ${renderTopBar(
                'Submission Tasks',
                'There was a problem loading your submission data.'
            )}

            <div
                class="
                    rounded-3xl
                    p-6
                    bg-white
                    border
                    border-red-100
                    text-red-600
                "
            >
                ${escapeHtml(
                    error?.message
                    || 'Unexpected error.'
                )}
            </div>

        `;

    } finally {

        isFetchingData =
            false;

    }

}


/* =========================================================
   INITIALIZATION
========================================================= */

window.onload = async () => {

    await loadSidebar();

    await fetchAllData();


    /*
    |--------------------------------------------------------------------------
    | Search preservation
    |--------------------------------------------------------------------------
    */

    document.addEventListener(
        'input',
        event => {

            if (
                event.target?.id
                === 'taskSearch'
            ) {

                window.__lastSearch =
                    event.target.value;

            }

        }
    );


    /*
    |--------------------------------------------------------------------------
    | Close notifications when clicking outside
    |--------------------------------------------------------------------------
    */

    document.addEventListener(
        'click',
        event => {

            if (
                !event.target.closest(
                    '.notif-bell'
                )
                &&
                !event.target.closest(
                    '#notifDropdown'
                )
            ) {

                document
                    .getElementById(
                        'notifDropdown'
                    )
                    ?.classList
                    .remove('open');

            }

        }
    );

};

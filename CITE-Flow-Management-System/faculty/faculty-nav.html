<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faculty Navigation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<link rel="stylesheet" href="faculty-nav.css">
</head>
<body>

<aside class="sidebar">

<div class="logo-area" data-page="dashboard.html">
    <img src="/assets/ctu-logo.png" alt="CTU Logo" onerror="this.style.display='none'">
    <div>
        <h2>College of Technology</h2>
        <h2>and Engineering</h2>
    </div>
</div>

<div class="sidebar-menu">

    <div class="nav-item" data-page="dashboard.html">
        <i class="fa-solid fa-chart-line"></i>
        Dashboard
    </div>

    <div class="nav-item" data-page="submissions.html">
        <i class="fa-solid fa-file-arrow-up"></i>
        Submissions
    </div>

    <div class="nav-item" data-page="status-tracking.html">
        <i class="fa-solid fa-bars-progress"></i>
        Status Tracking
    </div>

    <div class="nav-item" data-page="document.html">
        <i class="fa-solid fa-folder"></i>
        Document Vault
    </div>

    <div class="nav-item" data-page="calendar.html">
        <i class="fa-solid fa-calendar"></i>
        Calendar
    </div>

    <div class="nav-item" data-page="system-settings.html">
        <i class="fa-solid fa-gear"></i>
        Settings
    </div>

</div>

</aside>

<nav class="navbar">

    <div class="search-box">
        <i class="fa-solid fa-magnifying-glass text-slate-400"></i>
        <input type="text" id="facultySearchInput" placeholder="Search...">
    </div>

    <div class="flex items-center gap-3">
        <button class="nav-btn" onclick="toggleFacultyProfileModal()" title="Profile Menu">
            <i class="fa-solid fa-user"></i>
        </button>
    </div>

</nav>

<!-- Profile Modal Backdrop -->
<div id="facultyProfileBackdrop" class="modal-backdrop" onclick="toggleFacultyProfileModal()"></div>

<!-- Profile Dropdown Modal -->
<div id="facultyProfileModal" class="profile-modal">
    <div class="p-4 border-b border-gray-100 flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-[#621708] text-white flex items-center justify-center font-bold">
            <i class="fa-solid fa-user"></i>
        </div>
        <div>
            <div id="facultyNavProfileName" class="font-semibold text-sm text-gray-900">Faculty Member</div>
            <div id="facultyNavProfileRole" class="text-xs text-gray-500">CITE Faculty</div>
        </div>
    </div>
    <div class="p-2 space-y-1">
        <div class="nav-item text-gray-700 hover:bg-gray-100 rounded-xl" data-page="faculty-profile.html">
            <i class="fa-solid fa-id-card"></i> View Profile
        </div>
        <div class="nav-item text-gray-700 hover:bg-gray-100 rounded-xl" data-page="system-settings.html">
            <i class="fa-solid fa-sliders"></i> Settings
        </div>
        <div class="border-t border-gray-100 my-1"></div>
        <div class="nav-item text-red-600 hover:bg-red-50 rounded-xl" onclick="facultyLogout()">
            <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
        </div>
    </div>
</div>

</body>
</html>

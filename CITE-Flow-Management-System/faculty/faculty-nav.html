<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faculty Navigation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<link rel="stylesheet" href="faculty-nav.css">
</head>
<body>

<aside class="sidebar">

<div class="logo-area" data-page="dashboard.html">
    <img src="/assets/ctu-logo.png" alt="CTU Logo" onerror="this.style.display='none'">
    <div>
        <h2>College of Technology</h2>
        <h2>and Engineering</h2>
    </div>
</div>

<div class="sidebar-menu">

    <div class="nav-item" data-page="dashboard.html">
        <i class="fa-solid fa-chart-line"></i>
        Dashboard
    </div>

    <div class="nav-item" data-page="faculty-profile.html">
        <i class="fa-solid fa-user"></i>
        Faculty Profile
    </div>

    <div class="nav-item" data-page="calendar.html">
        <i class="fa-solid fa-calendar"></i>
        Calendar
    </div>

    <div class="nav-item" data-page="document.html">
        <i class="fa-solid fa-file-lines"></i>
        Documents
    </div>

    <div class="nav-item" data-page="status-tracking.html">
        <i class="fa-solid fa-list-check"></i>
        Status Tracking
    </div>

    <div class="nav-item" data-page="submissions.html">
        <i class="fa-solid fa-upload"></i>
        Submissions
    </div>

    <div class="nav-item" data-page="system-settings.html">
        <i class="fa-solid fa-gear"></i>
        System Settings
    </div>

</div>

</aside>

<nav class="navbar">

    <div class="search-box">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" placeholder="Search Something..." id="searchInput">
    </div>

    <div class="nav-actions">

        <div class="nav-btn" onclick="alert('Notifications')">
            <i class="fa-solid fa-bell"></i>
        </div>

        <div class="nav-btn" onclick="toggleProfileModal()">
            <i class="fa-regular fa-circle-user"></i>
        </div>

    </div>

</nav>

<div id="profileBackdrop" class="profile-backdrop"></div>

<div id="profileModal" class="profile-modal">

<div class="profile-header">

    <div class="profile-info">
        <h2 id="profileName">Faculty Member</h2>
        <p id="profileRole">Instructor</p>
    </div>

    <i class="fa-regular fa-circle-user profile-icon"></i>

</div>

<div class="profile-body">

    <div class="profile-row">
        <strong>Department:</strong>
        <span id="profileDepartment">BSIT</span>
    </div>

    <div class="profile-row">
        <strong>Role:</strong>
        <span id="profileRoleDetail">Faculty</span>
    </div>

    <button type="button" class="profile-link" data-page="faculty-profile.html">
        <i class="fa-solid fa-user"></i>
        My Profile
    </button>

    <button type="button" class="profile-link" data-page="system-settings.html">
        <i class="fa-solid fa-gear"></i>
        Settings
    </button>

    <button type="button" class="profile-link" onclick="alert('Help & Support')">
        <i class="fa-solid fa-circle-question"></i>
        Help & Support
    </button>

    <button type="button" class="logout-btn" onclick="window.location.href='../auth/login.html'">
        Logout
    </button>

</div>

</div>

<div class="message-btn" onclick="openMessages()">
    <i class="fa-solid fa-comments"></i>
</div>

</body>
</html>

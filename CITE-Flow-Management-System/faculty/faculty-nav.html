<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faculty Navigation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<link rel="stylesheet" href="faculty-nav.css">
</head>
<body>

<aside class="sidebar">

<div class="logo-area" data-page="dashboard.html">
    <img src="/assets/ctu-logo.png" alt="CTU Logo" onerror="this.style.display='none'">
    <div>
        <h2>College of Technology</h2>
        <h2>and Engineering</h2>
    </div>
</div>

<div class="sidebar-menu">

    <div class="nav-item" data-page="dashboard.html">
        <i class="fa-solid fa-chart-line"></i>
        Dashboard
    </div>

    <div class="nav-item" data-page="submissions.html">
        <i class="fa-solid fa-file-arrow-up"></i>
        Submissions
    </div>

    <div class="nav-item" data-page="status-tracking.html">
        <i class="fa-solid fa-bars-progress"></i>
        Status Tracking
    </div>

    <div class="nav-item" id="facultyWorkflowReviewNav" data-page="../admin/workflow-approval.html" style="display:none;">
        <i class="fa-solid fa-clipboard-check"></i>
        Workflow Review
    </div>

    <div class="nav-item" data-page="document.html">
        <i class="fa-solid fa-folder"></i>
        Document Vault
    </div>

    <div class="nav-item" data-page="calendar.html">
        <i class="fa-solid fa-calendar"></i>
        Calendar
    </div>

    <div class="nav-item" data-page="system-settings.html">
        <i class="fa-solid fa-gear"></i>
        Settings
    </div>

</div>

</aside>

<nav class="navbar">

    <div class="flex items-center gap-2">
        <!-- Push Button para sa Mobile Drawer Toggle -->
        <button type="button" id="mobileSidebarToggle" onclick="toggleFacultyMobileSidebar()" class="drawer-push-btn" title="Toggle Menu" aria-label="Toggle Menu">
            <i class="fa-solid fa-bars"></i>
        </button>

        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="facultySearchInput" placeholder="Search Something...">
        </div>
    </div>

    <div class="nav-actions flex items-center gap-2">
        <button class="nav-btn" onclick="alert('Notifications')" title="Notifications">
            <i class="fa-solid fa-bell"></i>
        </button>
        <button class="nav-btn" onclick="toggleFacultyProfileModal()" title="Profile Menu">
            <i class="fa-regular fa-circle-user"></i>
        </button>
    </div>

</nav>

<div id="facultyProfileBackdrop" class="profile-backdrop"></div>

<!-- Profile Dropdown Modal (Admin Style Redesign) -->
<div id="facultyProfileModal" class="profile-modal">

    <div class="profile-header">
        <div class="profile-info">
            <h2 id="facultyNavProfileName">Faculty Member</h2>
            <p id="facultyNavProfileRole">CITE Faculty</p>
        </div>
        <!-- Profile Picture Container -->
        <div style="width: 48px; height: 48px; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.2); flex-shrink: 0;">
            <img id="modalProfileImg" class="profile-avatar-img" src="" alt="Profile" style="width: 100%; height: 100%; object-fit: cover; display: none;">
            <i id="modalProfileIcon" class="profile-icon fa-regular fa-circle-user" style="font-size: 36px; color: #fff;"></i>
        </div>
    </div>

    <div class="profile-body">
        <div class="profile-row">
            <strong>Department:</strong>
            <span id="facultyNavDept">BSIT</span>
        </div>

        <div class="profile-row">
            <strong>Role:</strong>
            <span id="facultyNavRoleDetail">Faculty Member</span>
        </div>

        <button type="button" class="profile-link" onclick="window.location.href='faculty-profile.html'">
            <i class="fa-solid fa-user"></i>
            My Profile
        </button>

        <button type="button" class="profile-link" onclick="window.location.href='system-settings.html'">
            <i class="fa-solid fa-gear"></i>
            Settings
        </button>

        <button type="button" class="profile-link" onclick="alert('Help & Support')">
            <i class="fa-solid fa-circle-question"></i>
            Help & Support
        </button>

        <button type="button" class="logout-btn" onclick="facultyLogout()">
            Logout
        </button>
    </div>

</div>

<div class="message-btn" id="citeflowMessageFab" onclick="openFacultyMessages()">
    <i class="fa-solid fa-comments"></i>
</div>

<!-- =========================================================
     MESSENGER — chat panel
     ========================================================= -->

<div id="msgrBackdrop" class="msgr-backdrop"></div>
<div class="msgr-dropdown" id="msgrDropdown" style="display:none;"></div>

<div id="msgrPanel" class="msgr-panel">
    <div class="msgr-header">
        <h2>Chats</h2>
        <div class="msgr-header-actions">
            <button type="button" class="msgr-icon-btn msgr-icon-btn-flat" id="msgrHeaderOptionsBtn" title="Options">
                <i class="fa-solid fa-ellipsis"></i>
            </button>
            <button type="button" class="msgr-icon-btn msgr-icon-btn-flat" title="Expand" id="msgrExpandBtn">
                <i class="fa-solid fa-up-right-and-down-left-from-center"></i>
            </button>
            <button type="button" class="msgr-icon-btn msgr-icon-btn-flat" id="msgrNewBtn" title="New Message">
                <i class="fa-solid fa-pen-to-square"></i>
            </button>
            <button type="button" class="msgr-icon-btn msgr-icon-btn-flat" id="msgrCloseBtn" title="Close">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
    </div>

    <div class="msgr-search">
        <input type="text" id="msgrConvoSearch" placeholder="Search Messenger">
    </div>

    <div class="msgr-filter-tabs" id="msgrFilterTabs">
        <button type="button" class="msgr-filter-tab active" data-filter="all">All</button>
        <button type="button" class="msgr-filter-tab" data-filter="unread">Unread</button>
        <button type="button" class="msgr-filter-tab" data-filter="groups">Groups</button>
        <button type="button" class="msgr-filter-tab" data-filter="archived">Archived</button>
    </div>

    <div class="msgr-search-results" id="msgrSearchResults" style="display:none;"></div>

    <div class="msgr-list" id="msgrList">
        <div class="msgr-empty">
            <i class="fa-regular fa-comments"></i>
            No conversations yet. Click the compose icon to start one.
        </div>
    </div>

    <div class="msgr-chat" id="msgrChat">
        <div class="msgr-chat-header">
            <button type="button" class="msgr-back-btn" id="msgrBackBtn" title="Back to conversations">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div class="msgr-avatar" id="msgrChatAvatar"></div>
            <div class="msgr-chat-title">
                <div class="name" id="msgrChatName">Chat</div>
                <div class="sub" id="msgrChatSub">Online</div>
            </div>
            <div class="msgr-chat-header-actions">
                <button type="button" class="msgr-icon-btn msgr-icon-btn-flat" id="msgrChatInfoBtn" title="Chat Details">
                    <i class="fa-solid fa-circle-info"></i>
                </button>
            </div>
        </div>

        <div class="msgr-messages" id="msgrMessages"></div>

        <div class="msgr-composer">
            <textarea id="msgrInput" rows="1" placeholder="Type a message..."></textarea>
            <button type="button" class="msgr-send-btn" id="msgrSendBtn" disabled>
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>

        <!-- Docked Chat Details Panel (Slide-in) -->
        <div class="msgr-docked-details" id="msgrDockedDetails" style="display:none;">
            <div class="msgr-docked-details-header">
                <button type="button" class="msgr-icon-btn msgr-icon-btn-flat" id="msgrDockedDetailsBackBtn" title="Back to chat">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <h3>Chat Details</h3>
            </div>
            <div class="msgr-docked-details-body" id="msgrDockedDetailsBody"></div>
        </div>
    </div>
</div>

</body>
</html>

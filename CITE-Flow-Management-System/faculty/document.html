<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Vault | CTU</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../shared/supabase-config.js"></script>
    <script src="../shared/auth.js"></script>
    <script src="../shared/auth-guard.js"></script>
    <script src="../shared/workflow.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="faculty-nav.css">
    <link rel="stylesheet" href="../shared/skeleton.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { font-family: 'Inter', sans-serif; }

        .card-shadow { 
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.05); 
        }

        .folder-card {
            transition: all 0.25s ease;
        }
        .folder-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.10);
        }
        .drive-list {
            background: #fff;
            border: 1px solid #e8eaed;
            border-radius: 8px;
            overflow: hidden;
        }
        .drive-list-head,
        .drive-row {
            display: grid;
            grid-template-columns: minmax(160px, 1.5fr) 140px 130px 90px 44px;
            align-items: center;
            gap: 8px;
            min-height: 48px;
            padding: 0 12px 0 16px;
        }
        .drive-list-head {
            color: #5f6368;
            font-size: 13px;
            font-weight: 500;
            border-bottom: 1px solid #e8eaed;
        }
        .drive-list-head button {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: inherit;
            font: inherit;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
        }
        .drive-list-head button:hover { color: #202124; }
        .view-btn {
            width: 40px;
            height: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            font-size: 0.85rem;
            color: #64748b;
            background: #fff;
            border: none;
            cursor: pointer;
        }
        .view-btn.active { background-color: #621708; color: white; }
        .soft-shadow { box-shadow: 0 10px 35px rgba(15, 23, 42, 0.06); }
        .doc-card { transition: all 0.2s ease; border-radius: 1.25rem; }
        .doc-card:hover { transform: translateY(-3px); box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08); }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .drive-row {
            position: relative;
            border-bottom: 1px solid #e8eaed;
            cursor: pointer;
            color: #202124;
            font-size: 14px;
        }
        .drive-row:last-child { border-bottom: none; }
        .drive-row:hover { background: #f8f9fa; }
        .drive-name {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
            font-weight: 500;
        }
        .drive-name i { font-size: 20px; width: 24px; text-align: center; flex-shrink: 0; }
        .drive-owner {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #5f6368;
            font-size: 13px;
        }
        .drive-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #f9ab00;
            color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            flex-shrink: 0;
        }
        .drive-muted { color: #5f6368; font-size: 13px; }
        .drive-sort { justify-self: end; color: #5f6368; font-size: 13px; }
        .drive-kebab {
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            color: #5f6368;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .drive-kebab:hover { background: #e8eaed; color: #202124; }
        .drive-row .context-menu {
            position: absolute;
            right: 8px;
            top: 42px;
            min-width: 180px;
            z-index: 30;
        }
        @media (max-width: 768px) {
            .drive-list-head, .drive-row {
                grid-template-columns: minmax(0, 1fr) 44px;
            }
            .drive-col-owner, .drive-col-date, .drive-col-size, .drive-sort { display: none; }
        }

        .modal {
            animation: fadeInScale 0.2s ease forwards;
        }
        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-header {
            background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
        }
        .file-card {
            transition: all 0.2s ease;
        }
        .file-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 18px -8px rgb(0 0 0 / 0.20);
        }

        .document-modal-backdrop {
            background: rgba(15, 23, 42, 0.72);
            backdrop-filter: blur(8px);
        }
        .document-modal-panel {
            box-shadow: 0 30px 80px rgba(15, 23, 42, 0.35);
            animation: documentModalIn 0.2s ease-out;
        }
        @keyframes documentModalIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .document-action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.55rem;
            border-radius: 0.85rem;
            font-size: 0.825rem;
            font-weight: 600;
            transition: all 0.18s ease;
        }
        .document-action-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }
        .document-primary-btn {
            background: #621708;
            color: #ffffff;
        }
        .document-primary-btn:hover:not(:disabled) {
            background: #8c2a10;
        }
        .document-secondary-btn {
            background: #ffffff;
            color: #334155;
            border: 1px solid #e2e8f0;
        }
        .document-secondary-btn:hover:not(:disabled) {
            border-color: #cbd5e1;
            background: #f8fafc;
        }
        .document-toast {
            position: fixed;
            right: 20px;
            bottom: 20px;
            z-index: 2600;
            background: #0f172a;
            color: white;
            border-radius: 16px;
            padding: 12px 18px;
            box-shadow: 0 18px 45px rgba(15, 23, 42, 0.28);
            font-size: 0.85rem;
            font-weight: 600;
            display: none;
            align-items: center;
            gap: 10px;
        }
        .document-toast.show {
            display: flex;
        }
    </style>
</head>

<script>
    // ==================== SUPABASE SETUP ====================
    const supabaseUrl = 'https://uforealazougjckepggc.supabase.co';
    const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmb3JlYWxhem91Z2pja2VwZ2djIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNjAzODksImV4cCI6MjA5MTgzNjM4OX0.wzGQAiYOuiQjb3gAbaF41yAJJyQ-CCHfMruNUEwfnp0';

    const DOCUMENT_STORAGE_BUCKETS = ['documents', 'document', 'document-vault', 'faculty-documents', 'uploads', 'files'];

    let supabaseClient = null;
    const supabaseLib = window.supabase || window.Supabase;
    if (supabaseLib && typeof supabaseLib.createClient === 'function') {
        supabaseClient = supabaseLib.createClient(supabaseUrl, supabaseAnonKey);
    } else {
        console.error("Supabase client library failed to load.");
        alert('Supabase library failed to load. Please refresh the page.');
    }

    let folders = [];
    let documents = [];
    let currentFolderId = null;
    let vaultFolderSort = { key: 'name', dir: 'asc' };
    let vaultDocSort = { key: 'date', dir: 'desc' };
    let currentFolderView = localStorage.getItem('facultyDocumentVaultView') || 'list';
    let allDocumentCount = 0;

    function escapeHtml(value) {
        return String(value ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }
    function jsArg(value) {
        return JSON.stringify(String(value ?? ''));
    }

    function formatDriveDate(value) {
        if (!value) return '';
        const d = new Date(value);
        if (Number.isNaN(d.getTime())) return '';
        const opts = { month: 'short', day: 'numeric' };
        if (d.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric';
        return d.toLocaleDateString('en-US', opts);
    }

    function resolveFolderColor(color) {
        const map = {
            'text-amber-600': '#d97706',
            'text-blue-600': '#2563eb',
            'text-emerald-600': '#059669',
            'text-purple-600': '#7c3aed',
            'text-rose-600': '#e11d48',
            'text-orange-600': '#ea580c',
            'text-cyan-600': '#0891b2'
        };
        if (!color) return '#5f6368';
        if (String(color).startsWith('#')) return color;
        return map[color] || '#5f6368';
    }

    function setVaultFolderSort(key) {
        if (vaultFolderSort.key === key) vaultFolderSort.dir = vaultFolderSort.dir === 'asc' ? 'desc' : 'asc';
        else { vaultFolderSort.key = key; vaultFolderSort.dir = key === 'name' ? 'asc' : 'desc'; }
        renderFolders();
    }

    function sortArrow(key) {
        if (vaultFolderSort.key !== key) return '';
        return vaultFolderSort.dir === 'asc'
            ? '<i class="fa-solid fa-arrow-up text-xs text-blue-600"></i>'
            : '<i class="fa-solid fa-arrow-down text-xs text-blue-600"></i>';
    }

    function setVaultDocSort(key) {
        if (vaultDocSort.key === key) vaultDocSort.dir = vaultDocSort.dir === 'asc' ? 'desc' : 'asc';
        else { vaultDocSort.key = key; vaultDocSort.dir = key === 'name' ? 'asc' : 'desc'; }
        renderFolderDocuments();
    }

    function sortDocArrow(key) {
        if (vaultDocSort.key !== key) return '';
        return vaultDocSort.dir === 'asc'
            ? '<i class="fa-solid fa-arrow-up text-xs text-blue-600"></i>'
            : '<i class="fa-solid fa-arrow-down text-xs text-blue-600"></i>';
    }

    function sortDocuments(list) {
        return list.slice().sort((a, b) => {
            const dir = vaultDocSort.dir === 'asc' ? 1 : -1;
            if (vaultDocSort.key === 'size') return ((Number(a.size_bytes) || 0) - (Number(b.size_bytes) || 0)) * dir;
            if (vaultDocSort.key === 'date') return (new Date(a.uploaded_at || a.created_at || 0) - new Date(b.uploaded_at || b.created_at || 0)) * dir;
            return String(a.name || '').localeCompare(String(b.name || ''), undefined, { sensitivity: 'base' }) * dir;
        });
    }

    function getFileIconColor(filename, mimeType = '') {
        const ext = getFileExtension(filename);
        const type = String(mimeType || '').toLowerCase();
        if (ext === 'pdf' || type.includes('pdf')) return '#ea4335';
        if (['doc', 'docx'].includes(ext) || type.includes('word')) return '#4285f4';
        if (['xls', 'xlsx', 'csv'].includes(ext) || type.includes('spreadsheet') || type.includes('excel')) return '#0f9d58';
        if (['ppt', 'pptx'].includes(ext) || type.includes('presentation') || type.includes('powerpoint')) return '#fbbc04';
        if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg'].includes(ext) || type.includes('image')) return '#a142f4';
        return '#5f6368';
    }

    // ==================== LOAD DATA ====================
    function formatVaultFolderName(name) {
        if (window.CiteFlowWorkflow && typeof CiteFlowWorkflow.resolveDocumentCategory === 'function') {
            const resolved = CiteFlowWorkflow.resolveDocumentCategory(name);
            if (resolved) return CiteFlowWorkflow.formatDocumentCategory(resolved);
        }
        return name || '';
    }

    async function loadFolders() {
        const { data: folderData, error: folderError } = await supabaseClient
            .from('folders')
            .select('*')
            .order('name');

        if (folderError) {
            console.error("Load Folders Error:", folderError);
            alert("Error loading folders: " + folderError.message);
            return;
        }

        const { data: documentData, error: documentError } = await supabaseClient
            .from('documents')
            .select('folder_id');

        if (documentError) {
            console.error("Load Document Counts Error:", documentError);
            folders = folderData || [];
            allDocumentCount = 0;
            updateVaultStats();
            return;
        }

        const countMap = (documentData || []).reduce((acc, doc) => {
            acc[doc.folder_id] = (acc[doc.folder_id] || 0) + 1;
            return acc;
        }, {});

        allDocumentCount = (documentData || []).length;
        folders = (folderData || []).map(folder => ({
            ...folder,
            count: countMap[folder.id] || 0
        }));
        updateVaultStats();
    }

    function updateVaultStats() {
        const statF = document.getElementById('stat-folders');
        const statD = document.getElementById('stat-documents');
        if (statF) statF.textContent = folders.length;
        if (statD) statD.textContent = allDocumentCount;
    }

    async function refreshVault() {
        await loadFolders();
        renderFolders();
        if (currentFolderId) {
            await loadDocumentsByFolder(currentFolderId);
            const countEl = document.getElementById('folder-count');
            if (countEl) countEl.textContent = `${documents.length} document${documents.length !== 1 ? 's' : ''}`;
            renderFolderDocuments();
        }
    }

    async function loadDocumentsByFolder(folderId) {
        const { data, error } = await supabaseClient
            .from('documents')
            .select('*')
            .eq('folder_id', folderId)
            .order('uploaded_at', { ascending: false });

        if (error) {
            console.error(error);
            documents = [];
        } else {
            documents = data || [];
        }
    }

    // ==================== DOCUMENT ACTIONS ====================
    let currentPreviewDocument = null;
    let currentPreviewAccess = null;

    function getFileExtension(filename) {
        return String(filename || '').split('.').pop().toLowerCase();
    }

    function getFileTypeLabel(filename, mimeType = '') {
        const ext = getFileExtension(filename);
        if (ext) return ext.toUpperCase();
        if (mimeType) return mimeType;
        return 'FILE';
    }

    function getFileIconClass(filename, mimeType = '') {
        const ext = getFileExtension(filename);
        const type = String(mimeType || '').toLowerCase();
        if (ext === 'pdf' || type.includes('pdf')) return 'fa-file-pdf';
        if (['doc', 'docx'].includes(ext) || type.includes('word')) return 'fa-file-word';
        if (['xls', 'xlsx', 'csv'].includes(ext) || type.includes('spreadsheet') || type.includes('excel')) return 'fa-file-excel';
        if (['ppt', 'pptx'].includes(ext) || type.includes('presentation') || type.includes('powerpoint')) return 'fa-file-powerpoint';
        if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg'].includes(ext) || type.includes('image')) return 'fa-file-image';
        if (['zip', 'rar', '7z'].includes(ext)) return 'fa-file-zipper';
        if (['txt', 'md'].includes(ext) || type.includes('text')) return 'fa-file-lines';
        return 'fa-file-lines';
    }

    function getFilePreviewKind(doc) {
        const ext = getFileExtension(doc.name);
        const type = String(doc.mime_type || '').toLowerCase();
        if (ext === 'pdf' || type.includes('pdf')) return 'direct';
        if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg'].includes(ext) || type.includes('image')) return 'direct';
        if (['txt', 'md', 'csv'].includes(ext) || type.includes('text')) return 'direct';
        if (['doc', 'docx', 'xls', 'xlsx', 'ppt', 'pptx'].includes(ext)) return 'office';
        return 'direct';
    }

    function makePreviewUrl(doc, access) {
        const kind = getFilePreviewKind(doc);
        if (kind === 'office' && access?.url && !access.url.startsWith('blob:')) {
            return `https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(access.url)}`;
        }
        return access.url;
    }

    function formatFileSize(bytes) {
        if (!bytes) return '—';
        const sizes = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(1024));
        return Math.round(bytes / Math.pow(1024, i) * 100) / 100 + ' ' + sizes[i];
    }

    function showDocumentToast(message) {
        const toast = document.getElementById('documentToast');
        const text = document.getElementById('documentToastText');
        if (!toast || !text) return;

        text.textContent = message;
        toast.classList.add('show');
        clearTimeout(window.__documentToastTimer);
        window.__documentToastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function getCandidatePaths(originalPath) {
        const candidates = [];
        const safeOriginal = String(originalPath || '').trim();
        if (safeOriginal) candidates.push(safeOriginal);

        if (safeOriginal.startsWith('documents/')) {
            candidates.push(safeOriginal.replace(/^documents\//, ''));
        } else if (safeOriginal) {
            candidates.push(`documents/${safeOriginal}`);
        }

        return [...new Set(candidates.filter(Boolean))];
    }

    function getDocumentBucketCandidates(doc) {
        const rawBuckets = [
            doc?.bucket,
            doc?.bucket_id,
            doc?.bucket_name,
            doc?.storage_bucket,
            ...DOCUMENT_STORAGE_BUCKETS
        ];

        return [...new Set(rawBuckets.map(value => String(value || '').trim()).filter(Boolean))];
    }

    async function tryResolveInBucket(bucketName, path, expiresInSeconds) {
        const { data: signedData, error: signedError } = await supabaseClient.storage
            .from(bucketName)
            .createSignedUrl(path, expiresInSeconds);

        if (!signedError && signedData?.signedUrl) {
            return { url: signedData.signedUrl, path, bucket: bucketName, revoke: null };
        }

        const { data: blobData, error: blobError } = await supabaseClient.storage
            .from(bucketName)
            .download(path);

        if (!blobError && blobData) {
            const url = URL.createObjectURL(blobData);
            return { url, path, bucket: bucketName, revoke: () => URL.revokeObjectURL(url) };
        }

        const { data: publicData } = supabaseClient.storage
            .from(bucketName)
            .getPublicUrl(path);

        if (publicData?.publicUrl) {
            return { url: publicData.publicUrl, path, bucket: bucketName, revoke: null };
        }

        return null;
    }

    async function resolveDocumentAccessUrl(doc, expiresInSeconds = 3600) {
        if (!doc?.file_path) return null;

        const paths = getCandidatePaths(doc.file_path);
        const buckets = getDocumentBucketCandidates(doc);
        const attempts = [];

        for (const bucketName of buckets) {
            for (const path of paths) {
                attempts.push(`${bucketName}/${path}`);
                try {
                    const access = await tryResolveInBucket(bucketName, path, expiresInSeconds);
                    if (access?.url) return access;
                } catch (error) {
                    console.warn('Document access attempt failed:', bucketName, path, error?.message || error);
                }
            }
        }

        return null;
    }

    function openDocumentPreviewModal(doc, access) {
        currentPreviewDocument = doc;
        currentPreviewAccess = access;

        const modal = document.getElementById('documentPreviewModal');
        const frame = document.getElementById('documentPreviewFrame');
        const loader = document.getElementById('previewLoading');
        const fileSize = formatFileSize(doc.size_bytes);
        const fileType = getFileTypeLabel(doc.name, doc.mime_type);
        const uploadedDate = doc.uploaded_at ? new Date(doc.uploaded_at).toLocaleDateString() : 'Unknown';
        const iconClass = getFileIconClass(doc.name, doc.mime_type);

        document.getElementById('previewFileIcon').innerHTML = `<i class="fa-solid ${iconClass}"></i>`;
        document.getElementById('previewDocumentTitle').textContent = doc.name || 'Document Preview';
        document.getElementById('previewDocumentMeta').textContent = `${fileType} • ${fileSize} • Uploaded ${uploadedDate}`;
        document.getElementById('previewSideName').textContent = doc.name || '-';
        document.getElementById('previewSideType').textContent = fileType;
        document.getElementById('previewSideSize').textContent = fileSize;
        document.getElementById('previewSideDate').textContent = uploadedDate;

        loader.style.display = 'flex';
        frame.src = 'about:blank';
        modal.classList.remove('hidden');
        modal.classList.add('flex');

        setTimeout(() => {
            frame.src = makePreviewUrl(doc, access);
        }, 50);

        frame.onload = () => {
            loader.style.display = 'none';
        };

        setTimeout(() => {
            loader.style.display = 'none';
        }, 3500);
    }

    function closeDocumentPreviewModal() {
        const modal = document.getElementById('documentPreviewModal');
        const frame = document.getElementById('documentPreviewFrame');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        frame.src = 'about:blank';

        if (currentPreviewAccess && typeof currentPreviewAccess.revoke === 'function') {
            currentPreviewAccess.revoke();
        }

        currentPreviewDocument = null;
        currentPreviewAccess = null;
    }

    function openPreviewInNewTab() {
        if (!currentPreviewDocument || !currentPreviewAccess?.url) return;
        window.open(makePreviewUrl(currentPreviewDocument, currentPreviewAccess), '_blank');
    }

    async function viewDocument(id) {
        const doc = documents.find(d => String(d.id) === String(id));
        if (!doc) {
            alert('Document not found.');
            return;
        }

        try {
            showDocumentToast('Preparing preview...');
            const access = await resolveDocumentAccessUrl(doc, 3600);
            if (!access?.url) {
                alert('Unable to preview document. Storage path could not be resolved.');
                return;
            }
            openDocumentPreviewModal(doc, access);
        } catch (err) {
            console.error('Preview error:', err);
            alert('Unable to preview document.');
        }
    }

    async function downloadDocument(id) {
        const doc = documents.find(d => String(d.id) === String(id));
        if (!doc) {
            alert('Document not found.');
            return;
        }

        try {
            showDocumentToast('Preparing download...');
            const access = await resolveDocumentAccessUrl(doc, 300);
            if (!access?.url) {
                alert('Unable to download document. Storage path could not be resolved.');
                return;
            }

            const a = document.createElement('a');
            a.href = access.url;
            a.download = doc.name || 'document';
            a.target = '_blank';
            document.body.appendChild(a);
            a.click();
            a.remove();

            showDocumentToast('Download started.');

            if (window.EngagementLogger?.logDownload) {
                window.EngagementLogger.logDownload({
                    fileName: doc.name,
                    sourceModule: 'Document Vault',
                    description: 'Downloaded ' + (doc.name || 'a document') + ' from shared academic resources.'
                });
            }

            if (typeof access.revoke === 'function') {
                setTimeout(access.revoke, 60000);
            }
        } catch (err) {
            console.error('Download error:', err);
            alert('Unable to download document.');
        }
    }

    async function downloadCurrentPreviewDocument() {
        if (!currentPreviewDocument) return;
        await downloadDocument(currentPreviewDocument.id);
    }

    document.addEventListener('keydown', function(e) {
        if (e.key !== 'Escape') return;
        const preview = document.getElementById('documentPreviewModal');
        if (preview && !preview.classList.contains('hidden')) {
            closeDocumentPreviewModal();
            return;
        }
        if (currentFolderId) goBackToMain();
    });

    // ==================== INITIALIZE ====================
    window.onload = async () => {
        await loadSidebar();
        if (supabaseClient) {
            await loadFolders();
            renderFolders();
            setFolderView(currentFolderView, false);
        }
    };
</script>

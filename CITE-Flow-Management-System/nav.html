<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTE Admin Navigation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<link rel="stylesheet" href="nav.css">
</head>
<body>

<aside class="sidebar">

<div class="logo-area" data-page="dashboard.html">
    <img src="../assets/ctu-logo.png" alt="CTU Logo" onerror="this.style.display='none'">
    <div>
        <h2>College of Technology</h2>
        <h2>and Engineering</h2>
    </div>
</div>

<div class="sidebar-menu">

    <div class="nav-item" data-page="dashboard.html">
        <i class="fa-solid fa-chart-line"></i>
        Dashboard
    </div>

    <div class="nav-item" data-page="faculty-profiles.html">
        <i class="fa-solid fa-user"></i>
        Faculty Profiles
    </div>

    <div class="nav-item" data-page="workload-tracker.html">
        <i class="fa-solid fa-file"></i>
        Workload Tracker
    </div>

    <div class="nav-item" data-page="engagement-logs.html">
        <i class="fa-solid fa-book"></i>
        Engagement Logs
    </div>

    <div class="nav-item" data-page="document-vault.html">
        <i class="fa-solid fa-folder"></i>
        Document Vault
    </div>

    <div class="nav-item" data-page="workflow-approval.html">
        <i class="fa-solid fa-arrow-down"></i>
        Workflow Approval
    </div>

    <div class="nav-item" data-page="calendar.html">
        <i class="fa-solid fa-calendar"></i>
        Calendar
    </div>

    <div class="nav-item" data-page="reports-analytics.html">
        <i class="fa-solid fa-chart-column"></i>
        Reports & Analytics
    </div>

    <div class="nav-item" data-page="feedback-summary.html">
        <i class="fa-solid fa-fire"></i>
        Seminar Feedback
    </div>

    <div class="nav-item" data-page="user-management.html">
        <i class="fa-solid fa-users"></i>
        User Management
    </div>

    

</div>

</aside>

<nav class="navbar">

    <div class="search-box">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" placeholder="Search Something..." id="searchInput">
    </div>

    <div class="nav-actions">

        <div class="nav-btn" onclick="alert('Notifications')">
            <i class="fa-solid fa-bell"></i>
        </div>

        <div class="nav-btn" onclick="toggleProfileModal()">
            <i class="fa-regular fa-circle-user"></i>
        </div>

    </div>

</nav>

<div id="profileBackdrop" class="profile-backdrop"></div>

<div id="profileModal" class="profile-modal">

<div class="profile-header">

    <div class="profile-info">
        <h2 id="profileName">Administrator</h2>
        <p id="profileRole">College Dean</p>
    </div>

    <i class="fa-regular fa-circle-user profile-icon"></i>

</div>

<div class="profile-body">

    <div class="profile-row">
        <strong>Department:</strong>
        <span id="profileDepartment">BSIT</span>
    </div>

    <div class="profile-row">
        <strong>Role:</strong>
        <span id="profileRoleDetail">College Dean</span>
    </div>

    <button type="button" class="profile-link" data-page="admin-profile.html">
        <i class="fa-solid fa-user"></i>
        My Profile
    </button>

    <button type="button" class="profile-link" data-page="system-settings.html">
        <i class="fa-solid fa-gear"></i>
        Settings
    </button>

    <button type="button" class="profile-link" onclick="alert('Help & Support')">
        <i class="fa-solid fa-circle-question"></i>
        Help & Support
    </button>

    <button type="button" class="logout-btn" onclick="window.location.href='../auth/login.html'">
        Logout
    </button>

</div>

</div>

<div class="message-btn" onclick="openMessages()">
    <i class="fa-solid fa-comments"></i>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CiteFlow - Register</title>


    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        /* =========================================
           RESET
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }


        body {
            font-family: 'Poppins', sans-serif;
            background: #f8f9fa;
        }


        /* =========================================
           MAIN CONTAINER
        ========================================= */

        .container {
            display: flex;

            width: 100%;
            height: 100vh;

            overflow: hidden;
        }


        /* =========================================
           LEFT SIDE
        ========================================= */

        .left-side {
            flex: 1;

            position: relative;

            min-width: 0;

            background:
                url('bldg1.jpg')
                center / cover
                no-repeat;

            overflow: hidden;
        }


        .left-side::after {
            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    180deg,
                    rgba(0, 0, 0, 0.04),
                    rgba(0, 0, 0, 0.18)
                );

            pointer-events: none;
        }


        /* =========================================
           DEPARTMENT LOGOS
        ========================================= */

        .dept-logos {
            position: absolute;

            left: 40px;
            bottom: 40px;

            display: flex;

            align-items: center;

            gap: 16px;

            z-index: 2;
        }


        .dept-logo-circle {
            width: 78px;
            height: 78px;

            border-radius: 50%;

            background: #ffffff;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 9px;

            box-shadow:
                0 6px 18px
                rgba(0, 0, 0, 0.28);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }


        .dept-logo-circle:hover {
            transform:
                translateY(-3px)
                scale(1.05);

            box-shadow:
                0 9px 22px
                rgba(0, 0, 0, 0.35);
        }


        .dept-logo {
            width: 100%;
            height: 100%;

            object-fit: contain;

            display: block;
        }


        /* =========================================
           RIGHT SIDE
        ========================================= */

        .right-side {
            flex: 1;

            min-width: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #ffffff;

            padding: 25px 35px;

            overflow: hidden;
        }


        .form-container {
            width: 100%;

            max-width: 500px;

            max-height: 100%;

            overflow: hidden;
        }


        /* =========================================
           CTU LOGO
        ========================================= */

        .logo {
            width: 75px;
            height: 75px;

            object-fit: contain;

            margin-bottom: 10px;
        }


        /* =========================================
           HEADER
        ========================================= */

        h1 {
            font-size: 2rem;

            color: #1f2937;

            margin-bottom: 5px;

            font-weight: 700;
        }


        .subtitle {
            color: #64748b;

            font-size: 0.92rem;

            margin-bottom: 20px;
        }


        /* =========================================
           FORM GRID
        ========================================= */

        .form-grid {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 13px 17px;
        }


        .input-group {
            position: relative;
        }


        .input-group label {
            display: block;

            font-size: 0.82rem;

            margin-bottom: 5px;

            color: #374151;

            font-weight: 500;
        }


        /* =========================================
           INPUT WRAPPER
        ========================================= */

        .input-wrapper {
            position: relative;
        }


        .input-wrapper input {
            width: 100%;

            height: 48px;

            padding:
                0 48px 0 48px;

            border:
                1.5px solid #e2e8f0;

            border-radius: 11px;

            font-family:
                'Poppins',
                sans-serif;

            font-size: 0.9rem;

            color: #1f2937;

            background: #ffffff;

            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease;
        }


        .input-wrapper input::placeholder {
            color: #9ca3af;
        }


        .input-wrapper input:focus {
            outline: none;

            border-color: #9c2f1f;

            box-shadow:
                0 0 0 4px
                rgba(156, 47, 31, 0.12);
        }


        /* =========================================
           INPUT ICON
        ========================================= */

        .input-icon {
            position: absolute;

            left: 17px;
            top: 50%;

            transform:
                translateY(-50%);

            color: #64748b;

            font-size: 1rem;

            pointer-events: none;

            z-index: 2;
        }


        /* =========================================
           PASSWORD EYE
        ========================================= */

        .toggle-password {
            position: absolute;

            right: 17px;
            top: 50%;

            transform:
                translateY(-50%);

            color: #64748b;

            cursor: pointer;

            font-size: 1rem;

            z-index: 5;

            transition:
                color 0.2s ease,
                transform 0.2s ease;
        }


        .toggle-password:hover {
            color: #9c2f1f;
        }


        .toggle-password:active {
            transform:
                translateY(-50%)
                scale(0.9);
        }


        /* =========================================
           PASSWORD CONDITIONS
        ========================================= */

        .password-conditions {
            margin-top: 7px;

            padding: 8px 10px;

            background: #f8fafc;

            border:
                1px solid #e2e8f0;

            border-radius: 8px;

            font-size: 0.67rem;
        }


        .condition {
            display: flex;

            align-items: center;

            gap: 7px;

            margin: 3px 0;

            color: #94a3b8;

            transition:
                color 0.2s ease;
        }


        .condition i {
            width: 12px;

            font-size: 0.65rem;

            text-align: center;
        }


        .condition.valid {
            color: #16a34a;
        }


        .condition.valid i {
            color: #16a34a;
        }


        .condition.invalid {
            color: #94a3b8;
        }


        /* =========================================
           CONFIRM PASSWORD STATUS
        ========================================= */

        .confirm-status {
            display: none;

            margin-top: 6px;

            font-size: 0.68rem;
        }


        .confirm-status.valid {
            display: block;

            color: #16a34a;
        }


        .confirm-status.invalid {
            display: block;

            color: #dc2626;
        }


        /* =========================================
           MESSAGE
        ========================================= */

        .message {
            display: none;

            padding: 10px 14px;

            margin:
                0 0 12px;

            border-radius: 10px;

            font-size: 0.8rem;

            line-height: 1.5;
        }


        .message.success {
            background: #dcfce7;

            color: #166534;

            border:
                1px solid #bbf7d0;
        }


        .message.error {
            background: #fee2e2;

            color: #b91c1c;

            border:
                1px solid #fecaca;
        }


        /* =========================================
           REGISTER BUTTON
        ========================================= */

        .register-btn {
            width: 100%;

            height: 50px;

            margin-top: 16px;

            border: none;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    #9c2f1f,
                    #c2412d
                );

            color: #ffffff;

            font-family:
                'Poppins',
                sans-serif;

            font-size: 0.95rem;

            font-weight: 600;

            cursor: pointer;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;

            box-shadow:
                0 8px 20px
                rgba(156, 47, 31, 0.25);
        }


        .register-btn:hover {
            transform:
                translateY(-2px);

            box-shadow:
                0 12px 25px
                rgba(156, 47, 31, 0.35);
        }


        .register-btn:disabled {
            opacity: 0.7;

            cursor: not-allowed;

            transform: none;
        }


        /* =========================================
           LOGIN LINK
        ========================================= */

        .login-link {
            text-align: center;

            margin-top: 14px;

            font-size: 0.84rem;

            color: #64748b;
        }


        .login-link a {
            color: #9c2f1f;

            font-weight: 600;

            text-decoration: none;
        }


        .login-link a:hover {
            text-decoration: underline;
        }


        /* =========================================
           TABLET
        ========================================= */

        @media (max-width: 1000px) {

            html,
            body {
                overflow-y: auto;
            }


            .container {
                height: auto;

                min-height: 100vh;

                overflow: visible;

                flex-direction: column;
            }


            .left-side {
                height: 280px;

                flex: none;
            }


            .dept-logos {
                left: 25px;
                bottom: 25px;

                gap: 13px;
            }


            .dept-logo-circle {
                width: 62px;
                height: 62px;

                padding: 7px;
            }


            .right-side {
                padding: 35px 25px;

                overflow: visible;
            }


            .form-container {
                max-width: 550px;

                max-height: none;

                overflow: visible;
            }
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            .left-side {
                height: 220px;
            }


            .right-side {
                padding:
                    30px 20px;
            }


            .form-grid {
                grid-template-columns: 1fr;

                gap: 13px;
            }


            .logo {
                width: 65px;
                height: 65px;
            }


            h1 {
                font-size: 1.6rem;
            }


            .dept-logo-circle {
                width: 52px;
                height: 52px;

                padding: 6px;
            }


            .dept-logos {
                left: 18px;
                bottom: 18px;

                gap: 9px;
            }
        }


        /* =========================================
           SMALL HEIGHT DESKTOP
        ========================================= */

        @media
            (max-height: 750px)
            and (min-width: 1001px) {

            .right-side {
                padding-top: 12px;
                padding-bottom: 12px;
            }


            .logo {
                width: 60px;
                height: 60px;

                margin-bottom: 6px;
            }


            h1 {
                font-size: 1.75rem;
            }


            .subtitle {
                margin-bottom: 13px;
            }


            .form-grid {
                gap: 9px 15px;
            }


            .input-wrapper input {
                height: 44px;
            }


            .password-conditions {
                padding: 5px 8px;

                font-size: 0.62rem;
            }


            .register-btn {
                height: 45px;

                margin-top: 11px;
            }


            .login-link {
                margin-top: 9px;
            }
        }

    </style>

</head>


<body>


<div class="container">


    <!-- =========================================
         LEFT SIDE
    ========================================== -->

    <div class="left-side">

        <div class="dept-logos">


            <!-- BIT -->

            <div class="dept-logo-circle">

                <img
                    src="bit_logo.png"
                    alt="BIT Logo"
                    class="dept-logo"
                >

            </div>


            <!-- BSIT -->

            <div class="dept-logo-circle">

                <img
                    src="bsit_logo.png"
                    alt="BSIT Logo"
                    class="dept-logo"
                >

            </div>


            <!-- BSIE -->

            <div class="dept-logo-circle">

                <img
                    src="bsie_logo.png"
                    alt="BSIE Logo"
                    class="dept-logo"
                >

            </div>


        </div>

    </div>



    <!-- =========================================
         RIGHT SIDE
    ========================================== -->

    <div class="right-side">

        <div class="form-container">


            <!-- CTU LOGO -->

            <img
                src="ctu-logo.png"
                alt="CTU Logo"
                class="logo"
            >


            <h1>
                Create Administrator Account
            </h1>


            <p class="subtitle">
                Join CiteFlow and get started
            </p>


            <!-- MESSAGE -->

            <div
                id="message"
                class="message">
            </div>



            <!-- =================================
                 REGISTRATION FORM
            ================================== -->

            <form id="signup-form">


                <div class="form-grid">


                    <!-- FIRST NAME -->

                    <div class="input-group">

                        <label for="first-name">
                            First Name
                        </label>


                        <div class="input-wrapper">

                            <i
                                class="fas fa-user input-icon">
                            </i>


                            <input
                                type="text"
                                id="first-name"
                                placeholder="Juan"
                                required
                                autocomplete="given-name"
                            >

                        </div>

                    </div>



                    <!-- LAST NAME -->

                    <div class="input-group">

                        <label for="last-name">
                            Last Name
                        </label>


                        <div class="input-wrapper">

                            <i
                                class="fas fa-user input-icon">
                            </i>


                            <input
                                type="text"
                                id="last-name"
                                placeholder="Dela Cruz"
                                required
                                autocomplete="family-name"
                            >

                        </div>

                    </div>



                    <!-- ID NUMBER -->

                    <div class="input-group">

                        <label for="id-number">
                            ID Number
                        </label>


                        <div class="input-wrapper">

                            <i
                                class="fas fa-id-card input-icon">
                            </i>


                            <input
                                type="text"
                                id="id-number"
                                placeholder="2023-00123"
                                required
                                autocomplete="off"
                            >

                        </div>

                    </div>



                    <!-- EMAIL -->

                    <div class="input-group">

                        <label for="email">
                            Email Address
                        </label>


                        <div class="input-wrapper">

                            <i
                                class="fas fa-envelope input-icon">
                            </i>


                            <input
                                type="email"
                                id="email"
                                placeholder="name@ctu.edu.ph"
                                required
                                autocomplete="email"
                            >

                        </div>

                    </div>



                    <!-- =================================
                         PASSWORD
                    ================================== -->

                    <div class="input-group">

                        <label for="password">
                            Password
                        </label>


                        <div class="input-wrapper">

                            <i
                                class="fas fa-lock input-icon">
                            </i>


                            <input
                                type="password"
                                id="password"
                                placeholder="Create a password"
                                required
                                autocomplete="new-password"
                            >


                            <i
                                class="fas fa-eye toggle-password"
                                id="togglePassword"
                                role="button"
                                tabindex="0"
                                aria-label="Show password"
                                title="Show password">
                            </i>

                        </div>



                        <!-- PASSWORD REQUIREMENTS -->

                        <div class="password-conditions">


                            <div
                                class="condition"
                                id="lengthCondition">

                                <i class="fas fa-circle"></i>

                                <span>
                                    At least 8 characters
                                </span>

                            </div>


                            <div
                                class="condition"
                                id="uppercaseCondition">

                                <i class="fas fa-circle"></i>

                                <span>
                                    At least one uppercase letter
                                </span>

                            </div>


                            <div
                                class="condition"
                                id="lowercaseCondition">

                                <i class="fas fa-circle"></i>

                                <span>
                                    At least one lowercase letter
                                </span>

                            </div>


                            <div
                                class="condition"
                                id="numberCondition">

                                <i class="fas fa-circle"></i>

                                <span>
                                    At least one number
                                </span>

                            </div>


                            <div
                                class="condition"
                                id="specialCondition">

                                <i class="fas fa-circle"></i>

                                <span>
                                    At least one special character
                                </span>

                            </div>


                        </div>

                    </div>



                    <!-- =================================
                         CONFIRM PASSWORD
                    ================================== -->

                    <div class="input-group">

                        <label for="confirm-password">
                            Confirm Password
                        </label>


                        <div class="input-wrapper">

                            <i
                                class="fas fa-lock input-icon">
                            </i>


                            <input
                                type="password"
                                id="confirm-password"
                                placeholder="Confirm your password"
                                required
                                autocomplete="new-password"
                            >


                            <i
                                class="fas fa-eye toggle-password"
                                id="toggleConfirmPassword"
                                role="button"
                                tabindex="0"
                                aria-label="Show confirm password"
                                title="Show confirm password">
                            </i>

                        </div>


                        <div
                            id="confirmStatus"
                            class="confirm-status">
                        </div>

                    </div>


                </div>



                <!-- REGISTER BUTTON -->

                <button
                    type="submit"
                    id="registerBtn"
                    class="register-btn">

                    Create Account

                </button>


            </form>



            <!-- LOGIN -->

            <div class="login-link">

                Already have an account?

                <a href="login.html">
                    Log in
                </a>

            </div>


        </div>

    </div>

</div>



<script>

/* ============================================================
   SUPABASE CONFIGURATION
============================================================ */

const supabaseUrl =
    'https://uforealazougjckepggc.supabase.co';

const supabaseAnonKey =
    'sb_publishable_zsr5gF2_SeiOE6FHcj-p1A_XbieZ3GO';

const { createClient } = supabase;

const supabaseClient =
    createClient(
        supabaseUrl,
        supabaseAnonKey
    );


/* ============================================================
   ELEMENTS
============================================================ */

const form =
    document.getElementById('signup-form');

const registerBtn =
    document.getElementById('registerBtn');

const messageDiv =
    document.getElementById('message');

const passwordInput =
    document.getElementById('password');

const confirmPasswordInput =
    document.getElementById('confirm-password');

const confirmStatus =
    document.getElementById('confirmStatus');


/* ============================================================
   PASSWORD TOGGLE
============================================================ */

function setupPasswordToggle(toggleId, inputId) {

    const toggle =
        document.getElementById(toggleId);

    const input =
        document.getElementById(inputId);

    if (!toggle || !input) {
        return;
    }

    function togglePassword() {

        const isHidden =
            input.type === 'password';

        if (isHidden) {

            input.type = 'text';

            toggle.classList.remove(
                'fa-eye'
            );

            toggle.classList.add(
                'fa-eye-slash'
            );

            toggle.setAttribute(
                'aria-label',
                'Hide password'
            );

            toggle.setAttribute(
                'title',
                'Hide password'
            );

        } else {

            input.type = 'password';

            toggle.classList.remove(
                'fa-eye-slash'
            );

            toggle.classList.add(
                'fa-eye'
            );

            toggle.setAttribute(
                'aria-label',
                'Show password'
            );

            toggle.setAttribute(
                'title',
                'Show password'
            );
        }
    }

    toggle.addEventListener(
        'click',
        togglePassword
    );

    toggle.addEventListener(
        'keydown',
        function(event) {

            if (
                event.key === 'Enter' ||
                event.key === ' '
            ) {

                event.preventDefault();

                togglePassword();
            }
        }
    );
}


setupPasswordToggle(
    'togglePassword',
    'password'
);

setupPasswordToggle(
    'toggleConfirmPassword',
    'confirm-password'
);


/* ============================================================
   PASSWORD CONDITIONS
============================================================ */

function checkPasswordConditions() {

    const password =
        passwordInput.value;

    const conditions = {

        length:
            password.length >= 8,

        uppercase:
            /[A-Z]/.test(password),

        lowercase:
            /[a-z]/.test(password),

        number:
            /[0-9]/.test(password),

        special:
            /[^A-Za-z0-9]/.test(password)
    };


    updateCondition(
        'lengthCondition',
        conditions.length
    );

    updateCondition(
        'uppercaseCondition',
        conditions.uppercase
    );

    updateCondition(
        'lowercaseCondition',
        conditions.lowercase
    );

    updateCondition(
        'numberCondition',
        conditions.number
    );

    updateCondition(
        'specialCondition',
        conditions.special
    );


    return (
        conditions.length &&
        conditions.uppercase &&
        conditions.lowercase &&
        conditions.number &&
        conditions.special
    );
}


/* ============================================================
   UPDATE PASSWORD CONDITION
============================================================ */

function updateCondition(id, valid) {

    const element =
        document.getElementById(id);

    if (!element) {
        return;
    }

    const icon =
        element.querySelector('i');

    element.classList.toggle(
        'valid',
        valid
    );

    element.classList.toggle(
        'invalid',
        !valid
    );

    if (valid) {

        icon.className =
            'fas fa-check-circle';

    } else {

        icon.className =
            'fas fa-circle';
    }
}


/* ============================================================
   CONFIRM PASSWORD
============================================================ */

function checkConfirmPassword() {

    const password =
        passwordInput.value;

    const confirmPassword =
        confirmPasswordInput.value;


    if (
        confirmPassword.length === 0
    ) {

        confirmStatus.style.display =
            'none';

        confirmPasswordInput.style.borderColor =
            '#e2e8f0';

        return false;
    }


    if (
        password === confirmPassword
    ) {

        confirmStatus.textContent =
            '✓ Passwords match';

        confirmStatus.className =
            'confirm-status valid';

        confirmPasswordInput.style.borderColor =
            '#22c55e';

        return true;
    }


    confirmStatus.textContent =
        '✕ Passwords do not match';

    confirmStatus.className =
        'confirm-status invalid';

    confirmPasswordInput.style.borderColor =
        '#ef4444';

    return false;
}


passwordInput.addEventListener(
    'input',
    function() {

        checkPasswordConditions();

        checkConfirmPassword();
    }
);


confirmPasswordInput.addEventListener(
    'input',
    checkConfirmPassword
);


/* ============================================================
   MESSAGE
============================================================ */

function showMessage(text, type) {

    messageDiv.textContent =
        text;

    messageDiv.className =
        `message ${type}`;

    messageDiv.style.display =
        'block';
}


/* ============================================================
   FORM SUBMISSION
============================================================ */

form.addEventListener(
    'submit',
    async function(event) {

        event.preventDefault();


        messageDiv.style.display =
            'none';


        /* ----------------------------------------------------
           GET VALUES
        ---------------------------------------------------- */

        const firstName =
            document
                .getElementById('first-name')
                .value
                .trim();

        const lastName =
            document
                .getElementById('last-name')
                .value
                .trim();

        const idNumber =
            document
                .getElementById('id-number')
                .value
                .trim();

        const email =
            document
                .getElementById('email')
                .value
                .trim()
                .toLowerCase();

        const password =
            passwordInput.value;

        const confirmPassword =
            confirmPasswordInput.value;


        /* ----------------------------------------------------
           VALIDATION
        ---------------------------------------------------- */

        if (!firstName) {

            showMessage(
                'Please enter your first name.',
                'error'
            );

            return;
        }


        if (!lastName) {

            showMessage(
                'Please enter your last name.',
                'error'
            );

            return;
        }


        if (!idNumber) {

            showMessage(
                'Please enter your ID number.',
                'error'
            );

            return;
        }


        if (!email) {

            showMessage(
                'Please enter your email address.',
                'error'
            );

            return;
        }


        if (!checkPasswordConditions()) {

            showMessage(
                'Please complete all password requirements.',
                'error'
            );

            passwordInput.focus();

            return;
        }


        if (!checkConfirmPassword()) {

            showMessage(
                'Passwords do not match.',
                'error'
            );

            confirmPasswordInput.focus();

            return;
        }


        /* ----------------------------------------------------
           ADMIN VERIFICATION MODAL
        ---------------------------------------------------- */

        const adminCode =
            await requestAdminCode();

        if (!adminCode) {

            return;
        }


        /* ----------------------------------------------------
           DISABLE BUTTON
        ---------------------------------------------------- */

        registerBtn.disabled =
            true;

        registerBtn.textContent =
            'Creating administrator...';


        try {

            /* ------------------------------------------------
               CALL EDGE FUNCTION
            ------------------------------------------------ */

            const {
                data,
                error
            } =
                await supabaseClient.functions.invoke(
                    'register-admin',
                    {
                        body: {

                            first_name:
                                firstName,

                            last_name:
                                lastName,

                            id_number:
                                idNumber,

                            email:
                                email,

                            password:
                                password,

                            admin_code:
                                adminCode
                        }
                    }
                );


            if (error) {

                console.error(
                    'Edge Function Error:',
                    error
                );

                throw new Error(
                    error.message ||
                    'Unable to contact the registration server.'
                );
            }


            if (
                !data ||
                !data.success
            ) {

                throw new Error(
                    data?.message ||
                    'Administrator registration failed.'
                );
            }


            /* ------------------------------------------------
               SUCCESS
            ------------------------------------------------ */

            showMessage(
                'Administrator account created successfully! You may now log in.',
                'success'
            );


            form.reset();

            checkPasswordConditions();

            confirmStatus.style.display =
                'none';

            confirmPasswordInput.style.borderColor =
                '#e2e8f0';


            setTimeout(
                function() {

                    window.location.href =
                        'login.html';

                },
                3000
            );

        }


        catch (error) {

            console.error(
                'Registration Error:',
                error
            );


            const errorMessage =
                String(
                    error.message || ''
                ).toLowerCase();


            let message =
                'Unable to create administrator account. Please try again.';


            if (
                errorMessage.includes(
                    'already exists'
                ) ||
                errorMessage.includes(
                    'already registered'
                )
            ) {

                message =
                    'This email address is already registered. Please log in instead.';

            }

            else if (
                errorMessage.includes(
                    'invalid admin'
                ) ||
                errorMessage.includes(
                    'incorrect admin'
                ) ||
                errorMessage.includes(
                    'invalid registration code'
                )
            ) {

                message =
                    'The administrator registration code is incorrect.';

            }

            else if (
                errorMessage.includes(
                    'administrator already exists'
                )
            ) {

                message =
                    'An administrator account already exists. New administrators must be created or granted access by an existing administrator.';

            }

            else if (
                errorMessage.includes(
                    'password'
                )
            ) {

                message =
                    'The password does not meet the required conditions.';

            }


            showMessage(
                message,
                'error'
            );
        }


        finally {

            registerBtn.disabled =
                false;

            registerBtn.textContent =
                'Create Account';
        }
    }
);


/* ============================================================
   ADMIN CODE MODAL
============================================================ */

function requestAdminCode() {

    return new Promise(
        function(resolve) {

            const overlay =
                document.createElement('div');

            overlay.style.position =
                'fixed';

            overlay.style.inset =
                '0';

            overlay.style.background =
                'rgba(0,0,0,0.55)';

            overlay.style.display =
                'flex';

            overlay.style.alignItems =
                'center';

            overlay.style.justifyContent =
                'center';

            overlay.style.zIndex =
                '9999';


            overlay.innerHTML = `

                <div style="
                    width: 90%;
                    max-width: 430px;
                    background: white;
                    border-radius: 16px;
                    padding: 28px;
                    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
                    font-family: Poppins, sans-serif;
                ">

                    <div style="
                        width: 55px;
                        height: 55px;
                        border-radius: 50%;
                        background: #fef2f2;
                        color: #9c2f1f;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        margin: 0 auto 15px;
                        font-size: 22px;
                    ">

                        <i class="fas fa-user-shield"></i>

                    </div>

                    <h2 style="
                        text-align:center;
                        color:#1f2937;
                        margin-bottom:8px;
                        font-size:1.3rem;
                    ">
                        Administrator Verification
                    </h2>

                    <p style="
                        text-align:center;
                        color:#64748b;
                        font-size:0.82rem;
                        line-height:1.6;
                        margin-bottom:20px;
                    ">
                        This page is only for creating the
                        CiteFlow system administrator.
                        Enter the administrator registration
                        code to continue.
                    </p>

                    <input
                        id="adminRegistrationCode"
                        type="password"
                        placeholder="Administrator code"
                        autocomplete="off"
                        style="
                            width:100%;
                            height:48px;
                            border:1.5px solid #e2e8f0;
                            border-radius:10px;
                            padding:0 15px;
                            font-family:Poppins,sans-serif;
                            font-size:0.9rem;
                            outline:none;
                        "
                    >

                    <div
                        id="adminCodeError"
                        style="
                            display:none;
                            color:#dc2626;
                            font-size:0.75rem;
                            margin-top:7px;
                        "
                    >
                    </div>

                    <div style="
                        display:flex;
                        gap:10px;
                        margin-top:20px;
                    ">

                        <button
                            id="cancelAdminCode"
                            type="button"
                            style="
                                flex:1;
                                height:45px;
                                border:1px solid #e2e8f0;
                                background:white;
                                border-radius:10px;
                                font-family:Poppins,sans-serif;
                                font-weight:500;
                                cursor:pointer;
                            "
                        >
                            Cancel
                        </button>

                        <button
                            id="verifyAdminCode"
                            type="button"
                            style="
                                flex:1;
                                height:45px;
                                border:none;
                                background:#9c2f1f;
                                color:white;
                                border-radius:10px;
                                font-family:Poppins,sans-serif;
                                font-weight:600;
                                cursor:pointer;
                            "
                        >
                            Verify
                        </button>

                    </div>

                </div>
            `;


            document.body.appendChild(
                overlay
            );


            const input =
                overlay.querySelector(
                    '#adminRegistrationCode'
                );

            const errorDiv =
                overlay.querySelector(
                    '#adminCodeError'
                );

            const verifyBtn =
                overlay.querySelector(
                    '#verifyAdminCode'
                );

            const cancelBtn =
                overlay.querySelector(
                    '#cancelAdminCode'
                );


            input.focus();


            function close(value) {

                overlay.remove();

                resolve(value);
            }


            cancelBtn.addEventListener(
                'click',
                function() {

                    close(null);
                }
            );


            verifyBtn.addEventListener(
                'click',
                function() {

                    const code =
                        input.value.trim();


                    if (!code) {

                        errorDiv.textContent =
                            'Please enter the administrator code.';

                        errorDiv.style.display =
                            'block';

                        input.focus();

                        return;
                    }


                    close(code);
                }
            );


            input.addEventListener(
                'keydown',
                function(event) {

                    if (
                        event.key === 'Enter'
                    ) {

                        verifyBtn.click();
                    }


                    if (
                        event.key === 'Escape'
                    ) {

                        close(null);
                    }
                }
            );
        }
    );
}

</script>

# Forgot-password callers are signed out, so the gateway must not require a user JWT.
# The function still authenticates to the database with the service role and
# enforces OTP hash, expiry, attempt, and rate-limit checks itself.
[functions.forgot-password-otp]
verify_jwt = false

# Browser preflight has no JWT. The function still checks the user and is_document_vault_admin().
[functions.document-vault]
verify_jwt = false
